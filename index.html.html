<script id="curriculum" type="application/json">[{"title": "Zellen & genetische Information", "sub": "Wo das Leben seine Information aufbewahrt.", "goals": ["Zelle, Zellkern und Genom unterscheiden", "Gene als Information für funktionelle Produkte verstehen"], "sections": [["Die kleinste lebende Einheit", "Eine Zelle ist ein durch eine Membran abgegrenztes System. Sie nimmt Stoffe auf, wandelt Energie um und reguliert chemische Reaktionen. Eukaryoten wie Tiere, Pflanzen und Pilze besitzen einen Zellkern; Bakterien und Archaeen besitzen keinen membranumhüllten Zellkern. DNA liegt auch in Mitochondrien und bei Pflanzen in Chloroplasten. Reife menschliche rote Blutkörperchen haben dagegen keinen Zellkern."], ["Vom Molekül zum Merkmal", "Die DNA speichert Information in ihrer Basenfolge. Ein Gen ist ein DNA-Abschnitt, dessen Expression ein funktionelles RNA-Produkt hervorbringt; bei proteincodierenden Genen dient eine RNA als Zwischenstufe zur Herstellung eines Proteins. Proteine können etwa Enzyme, Rezeptoren oder Strukturbausteine sein. Merkmale entstehen aus molekularen Vorgängen, Entwicklung und Umwelt. Ein einzelnes Gen ist deshalb selten eine vollständige Erklärung eines komplexen Merkmals."], ["Die Ebenen auseinanderhalten", "Das Genom umfasst die genetische Information. Ein Chromosom ist eine organisierte DNA-Einheit mit zugehörigen Proteinen. Ein Gen liegt an einem bestimmten Genort, dem Locus. Unterschiedliche Sequenzvarianten an einem Locus heißen Allele. Der Genotyp bezeichnet die genetische Ausstattung, häufig bezogen auf bestimmte Loci; der Phänotyp die beobachtbaren Eigenschaften."]], "deep": [["Information ist kein fertiger Bauplan", "Fast alle kernhaltigen Körperzellen besitzen grundsätzlich dasselbe ererbte Genom. Trotzdem haben Nervenzellen und Muskelzellen andere Funktionen, weil sie unterschiedliche Gene in unterschiedlichem Maß exprimieren. Hinzu kommen erworbene Mutationen und spezielle DNA-Umlagerungen, etwa in Immunzellen. Zellidentität entsteht durch regulierte Genaktivität und stabile molekulare Zustände."], ["Das zentrale Dogma präzise", "DNA → RNA → Protein ist der häufigste Weg der Sequenzinformation. RNA kann auch als Vorlage für DNA dienen, beispielsweise bei Retroviren, und RNA-Genome können repliziert werden. Das zentrale Dogma schließt insbesondere eine Übertragung von Protein-Sequenzinformation zurück auf Nukleinsäuresequenzen aus. Es bedeutet nicht, dass jedes Gen ein Protein codiert."]], "trap": "Ein Gen ist weder ein Merkmal noch zwangsläufig eine Proteinbauanleitung.", "task": "Eine Hautzelle und eine Nervenzelle tragen weitgehend dieselbe DNA. Weshalb sehen sie unterschiedlich aus und erfüllen andere Aufgaben?", "solution": "Unterschiedliche regulatorische Faktoren aktivieren unterschiedliche Gruppen von Genen. Dadurch unterscheiden sich RNA- und Proteinbestände, Zellstruktur und Funktion. Nicht eine pauschal andere DNA-Sequenz, sondern vor allem unterschiedliche Genexpression erklärt den Unterschied.", "quiz": [["Welches Produkt kann unmittelbar aus der Expression eines Gens hervorgehen?", ["Nur ein Protein", "Eine funktionelle RNA", "Ein fertiges Organ"], 1, "Auch rRNA- und tRNA-Gene sind Gene. Ihr funktionelles Produkt ist RNA."], ["Was beschreibt der Phänotyp?", ["Beobachtbare Eigenschaften", "Nur die DNA-Sequenz", "Die Zahl aller Gene"], 0, "Phänotypische Eigenschaften entstehen durch Genotyp, Umwelt und Entwicklung."]], "terms": [["Gen", "DNA-Abschnitt, dessen Expression ein funktionelles RNA-Produkt erzeugt."], ["Allel", "Sequenzvariante an einem bestimmten Genort."], ["Genom", "Gesamtheit der genetischen Information eines Systems."]], "lab": null}, {"title": "Chemie des Lebens", "sub": "Die nötige Chemie – ohne Vorwissen.", "goals": ["Bindungen und molekulare Wechselwirkungen unterscheiden", "Enzyme, Energie und Bausteine einordnen"], "sections": [["Atome, Moleküle und Bindungen", "Atome bestehen aus einem Kern und einer Elektronenhülle. In kovalenten Bindungen teilen Atome Elektronenpaare; so entstehen stabile Molekülgerüste. Wasserstoffbrücken und elektrostatische Wechselwirkungen sind einzeln meist schwächer, wirken aber gemeinsam sehr wirksam. Die DNA-Stränge werden durch kovalente Bindungen innerhalb eines Stranges aufgebaut; zwischen den Strängen tragen Basenpaarung und Basenstapelung zur Stabilität bei."], ["Vier wichtige Stoffgruppen", "Nukleinsäuren bestehen aus Nukleotiden, Proteine aus Aminosäuren, viele Kohlenhydrate aus miteinander verbundenen Zuckern. Lipide bilden unter anderem Membranen. Ein Nukleotid enthält Base, Zucker und mindestens eine Phosphatgruppe. Ein Nukleosid besteht nur aus Base und Zucker. Die Reihenfolge von Bausteinen kann die Funktion eines Moleküls bestimmen."], ["Warum Reaktionen möglich werden", "Enzyme beschleunigen Reaktionen, indem sie die Aktivierungsenergie senken. Sie verändern weder die Gleichgewichtslage noch die freie Energiedifferenz zwischen Ausgangs- und Endzustand. Viele Zellreaktionen werden durch Kopplung an energetisch günstige Prozesse ermöglicht. Bei der Nukleinsäuresynthese liefern aktivierte Nukleosidtriphosphate Bausteine und chemisches Potenzial."]], "deep": [["Hydrolyse und Polymerisation", "Eine DNA-Polymerase verknüpft die 3′-OH-Gruppe des wachsenden Stranges mit dem α-Phosphat eines eintretenden dNTP. Pyrophosphat wird frei; dessen anschließende Hydrolyse begünstigt die Gesamtreaktion. Die Energie stammt also nicht aus einem beliebigen ATP-Molekül, das jede einzelne Bindung separat „bezahlt“."], ["Struktur schafft Selektivität", "Form, Ladung und Beweglichkeit eines aktiven Zentrums bestimmen, welche Substrate gebunden und umgesetzt werden. Enzyme sind dynamisch. Veränderungen von Temperatur oder pH können Ladungen, Faltung und Aktivität beeinflussen. „Mehr Wärme bedeutet immer schneller“ gilt deshalb nicht über beliebige Temperaturbereiche."]], "trap": "Ein Enzym macht eine energetisch ungünstige Gesamtreaktion nicht allein durch seine Anwesenheit günstig.", "task": "Ein Enzym beschleunigt eine reversible Reaktion um den Faktor 1000. Verändert sich dadurch das Verhältnis der Stoffe im Gleichgewicht?", "solution": "Nein. Das Gleichgewicht wird durch die freie Energiedifferenz bestimmt. Das Enzym beschleunigt Hin- und Rückreaktion; das Gleichgewicht wird schneller erreicht.", "quiz": [["Welche Bindung verbindet benachbarte Nukleotide eines DNA-Stranges?", ["Peptidbindung", "Wasserstoffbrücke", "Phosphodiesterbindung"], 2, "Die Phosphodiesterbindung verbindet Zucker über Phosphatgruppen."], ["Was verändert ein Enzym unmittelbar?", ["Die Aktivierungsenergie", "Die Gleichgewichtskonstante", "Die DNA aller Zellen"], 0, "Es ermöglicht einen Reaktionsweg mit niedrigerer Aktivierungsenergie."]], "terms": [["Enzym", "Biologischer Katalysator; meistens ein Protein, manchmal RNA."], ["Nukleotid", "Baustein aus Base, Zucker und Phosphatgruppe(n)."], ["Hydrolyse", "Spaltung einer chemischen Bindung unter Beteiligung von Wasser."]], "lab": null}, {"title": "DNA, RNA & Chromatin", "sub": "Struktur erklärt Funktion.", "goals": ["Basenpaarung und Strangrichtung anwenden", "DNA, RNA und Chromatin vergleichen"], "sections": [["Die DNA-Doppelhelix", "DNA enthält Desoxyribose und die Basen A, T, G und C. Zwei komplementäre Stränge verlaufen antiparallel: Einer in 5′→3′-, der andere in 3′→5′-Richtung. A paart normalerweise mit T, G mit C. Die Bezeichnungen 5′ und 3′ beziehen sich auf nummerierte Kohlenstoffatome des Zuckers. Sequenzen werden ohne anderslautende Angabe meist in 5′→3′-Richtung notiert."], ["RNA ist mehr als eine Kopie", "RNA enthält Ribose mit einer zusätzlichen 2′-OH-Gruppe und meist Uracil statt Thymin. Sie ist häufig einzelsträngig, kann aber durch interne Basenpaarung komplexe Formen ausbilden. mRNA dient als Vorlage für Proteine; tRNA vermittelt zwischen Codon und Aminosäure; rRNA ist struktureller und katalytischer Bestandteil des Ribosoms. Weitere RNAs regulieren und verarbeiten andere Moleküle."], ["Verpackung mit Folgen", "In eukaryotischen Zellkernen ist DNA an Histone und weitere Proteine gebunden. DNA wickelt sich um Histonkomplexe und bildet Nukleosomen. Dieses Chromatin ist kein passives Verpackungsmaterial: Seine Zugänglichkeit beeinflusst Transkription, Replikation und Reparatur. Stark kondensierte Chromosomen sind besonders während der Zellteilung sichtbar."]], "deep": [["Basenstapelung und Stabilität", "Wasserstoffbrücken ermöglichen die spezifische Paarung. Basenstapelung, Lösungsmittel und Ionen tragen wesentlich zur Stabilität der Helix bei. GC-reiche DNA hat unter vergleichbaren Bedingungen oft eine höhere Schmelztemperatur. Diese lässt sich jedoch nicht allein aus der Zahl der Wasserstoffbrücken exakt berechnen."], ["Nukleosomen sind dynamisch", "Ein kanonisches Nukleosom umfasst ungefähr 147 Basenpaare DNA um ein Histonoktamer. ATP-abhängige Chromatin-Remodellierer können Nukleosomen verschieben oder umstrukturieren. Histonvarianten und chemische Modifikationen beeinflussen die Interaktion mit regulatorischen Proteinen. Es gibt keine universelle starre Verpackungsleiter, die jede Zelle gleich verwendet."]], "trap": "Der Gegenstrang zu 5′-ATGC-3′ lautet antiparallel 3′-TACG-5′; in 5′→3′-Schreibweise ist er 5′-GCAT-3′.", "task": "Eine doppelsträngige DNA enthält 30 % Adenin. Bestimme die übrigen Basenanteile.", "solution": "T = 30 %. A und T ergeben zusammen 60 %, daher bleiben 40 % für G und C. G = 20 %, C = 20 %. Die Schlussfolgerung setzt reguläre komplementäre doppelsträngige DNA voraus.", "quiz": [["Welches Merkmal ist typisch für RNA?", ["Ribose und Uracil", "Desoxyribose und Thymin", "Ausschließlich Doppelsträngigkeit"], 0, "RNA enthält Ribose; Uracil ist eine ihrer vier Standardbasen."], ["Was bedeutet antiparallel?", ["Gleiche Basenfolge", "Gegenläufige 5′/3′-Orientierung", "Beide Stränge sind kreisförmig"], 1, "Die chemische Polarität der beiden DNA-Stränge ist entgegengesetzt."]], "terms": [["Chromatin", "Komplex aus DNA und assoziierten Proteinen im eukaryotischen Zellkern."], ["Nukleosom", "DNA, die um einen Histonkomplex gewickelt ist."], ["Komplementarität", "Spezifische Zuordnung der Basen A–T bzw. A–U und G–C."]], "lab": "sequence"}, {"title": "Zellzyklus & Mitose", "sub": "Eine Zelle verteilt ihr Erbgut.", "goals": ["DNA-Menge und Chromosomenzahl trennen", "Zellzyklus und Kontrollpunkte erklären"], "sections": [["Vorbereitung auf die Teilung", "Der Zellzyklus umfasst G1-, S-, G2- und M-Phase. In G1 wächst die Zelle und reagiert auf Signale. In der S-Phase wird DNA repliziert. In G2 wird die Teilung vorbereitet. Die M-Phase umfasst Mitose und gewöhnlich Cytokinese, die Teilung des Zellkörpers. Manche Zellen verlassen den aktiven Zyklus und gehen in einen G0-Zustand über."], ["Der Ablauf der Mitose", "Chromosomen kondensieren, die Spindel entsteht, und in vielen Eukaryoten löst sich die Kernhülle auf. Spindelmikrotubuli binden an Kinetochoren. In der Metaphase sind Chromosomen ausgerichtet. In der Anaphase werden Schwesterchromatiden getrennt und zu entgegengesetzten Polen bewegt. Danach entstehen neue Zellkerne; die Cytokinese teilt die Zelle."], ["Zählen ohne Denkfehler", "Vor der Replikation besitzt eine typische diploide menschliche Körperzelle 46 Chromosomen mit insgesamt 46 Chromatiden. Nach der S-Phase besitzt sie weiterhin 46 Chromosomen, nun mit 92 Chromatiden. Der DNA-Gehalt steigt von 2C auf 4C, die Ploidie bleibt 2n. Nach der Trennung zählen Schwesterchromatiden jeweils als eigene Chromosomen; jede Tochterzelle erhält wieder 46."]], "deep": [["Kontrolle durch Cycline und CDKs", "Cyclinabhängige Kinasen steuern durch Phosphorylierung den Übergang zwischen Phasen. Ihre Aktivität hängt unter anderem von Cyclinen und hemmenden Signalen ab. DNA-Schadensantworten können den Zyklus verzögern. Der Spindelkontrollpunkt hemmt den Anaphasebeginn, solange die erforderliche korrekte Anheftung nicht erreicht ist."], ["Die Trennung wird irreversibel", "Cohesine halten Schwesterchromatiden zusammen. Der APC/C-Komplex fördert den Abbau bestimmter regulatorischer Proteine, wodurch Separase aktiviert werden kann. Separase spaltet Cohesin. Fehler können Aneuploidien erzeugen: Zellen besitzen dann einzelne Chromosomen zu viel oder zu wenig."]], "trap": "Verdoppelte DNA-Menge bedeutet nicht automatisch verdoppelten Chromosomensatz.", "task": "Eine Zelle hat 2n = 6. Wie viele Chromosomen und Chromatiden besitzt sie nach der S-Phase und jede Tochterzelle nach der Mitose?", "solution": "Nach S: 6 Chromosomen, 12 Chromatiden, 4C. Nach Mitose und Cytokinese je Tochterzelle: 6 Chromosomen, 6 Chromatiden, 2C. Die Ploidie bleibt 2n.", "quiz": [["Wann wird die DNA repliziert?", ["In der Anaphase", "In der S-Phase", "Erst nach der Mitose"], 1, "Die Replikation findet in der S-Phase vor der Mitose statt."], ["Eine menschliche Zelle nach S besitzt typischerweise …", ["92 Chromosomen", "23 Chromosomen", "46 Chromosomen mit 92 Chromatiden"], 2, "Chromosomenzahl und Chromatidenzahl müssen getrennt gezählt werden."]], "terms": [["Schwesterchromatiden", "Durch Replikation entstandene Kopien eines Chromosoms."], ["Kinetochor", "Proteinkomplex am Centromer zur Anbindung der Spindel."], ["Aneuploidie", "Abweichende Anzahl einzelner Chromosomen."]], "lab": null}, {"title": "Meiose & Rekombination", "sub": "Warum Geschwister genetisch verschieden sind.", "goals": ["Reduktions- und Äquationsteilung unterscheiden", "Rekombination und zufällige Verteilung erklären"], "sections": [["Halbierung des Chromosomensatzes", "Sexuelle Fortpflanzung kombiniert zwei haploide Keimzellen zu einer diploiden Zygote. Die Meiose verhindert, dass sich die Chromosomensätze in jeder Generation verdoppeln. Auf eine Replikation folgen zwei Teilungen. Meiose I trennt homologe Chromosomen; Meiose II trennt Schwesterchromatiden. Zwischen beiden Teilungen liegt keine erneute S-Phase."], ["Homolog ist nicht identisch", "Homologe Chromosomen tragen grundsätzlich entsprechende Genorte, können aber unterschiedliche Allele besitzen. Je ein Homolog stammt von jedem Elternteil. In der Prophase I paaren sie sich. Beim Crossing-over werden entsprechende Abschnitte zwischen Nichtschwesterchromatiden ausgetauscht. Schwesterchromatiden können danach genetisch voneinander abweichen."], ["Zwei Quellen neuer Kombinationen", "Die zufällige Ausrichtung homologer Paare in Meiose I erzeugt unterschiedliche Kombinationen mütterlicher und väterlicher Chromosomen. Ohne Crossing-over sind bei n Paaren bis zu 2ⁿ Kombinationen möglich. Crossing-over erzeugt zusätzlich neue Kombinationen innerhalb eines Chromosoms. Diese Prozesse kombinieren vorhandene Allele; Mutationen können neue Allele erzeugen."]], "deep": [["Rekombination beginnt mit einem Bruch", "Bei vielen Organismen initiiert das Protein Spo11 programmierte DNA-Doppelstrangbrüche. Nach Verarbeitung der Bruchenden kann ein Einzelstrang in die homologe DNA eindringen. Reparatur erzeugt Crossovers oder Non-Crossovers. Chiasmata und Cohesion unterstützen die korrekte Trennung homologer Chromosomen."], ["Nichttrennung", "Trennen sich homologe Chromosomen in Meiose I nicht, können nach Meiose II alle Produkte hinsichtlich dieses Chromosoms betroffen sein. Bei Nichttrennung in Meiose II sind in einem einfachen Modell zwei von vier Produkten betroffen. In der menschlichen Oogenese entstehen allerdings nicht vier gleichwertige Eizellen, sondern eine große Eizelle und Polkörperchen."]], "trap": "Crossing-over findet typischerweise zwischen Nichtschwesterchromatiden homologer Chromosomen statt.", "task": "Eine Ausgangszelle besitzt 2n = 4. Gib Ploidie und DNA-Gehalt nach S, nach Meiose I und nach Meiose II an.", "solution": "Nach S: 2n, 4C. Nach Meiose I pro Zelle: n, 2C, weil jedes Chromosom noch zwei Chromatiden enthält. Nach Meiose II: n, 1C.", "quiz": [["Was wird in Meiose I getrennt?", ["Homologe Chromosomen", "Immer Schwesterchromatiden", "Nukleotide"], 0, "Die erste Teilung reduziert den Chromosomensatz."], ["Wie viele S-Phasen liegen zwischen Meiose I und II?", ["Eine", "Zwei", "Keine"], 2, "Eine erneute Replikation würde die Reduktion der DNA-Menge aufheben."]], "terms": [["Homologe Chromosomen", "Chromosomen mit entsprechenden Genorten, eines von jedem Elternteil."], ["Crossing-over", "Austausch zwischen Nichtschwesterchromatiden homologer Chromosomen."], ["Haploid", "Ein einfacher Chromosomensatz, bezeichnet mit n."]], "lab": "meiosis"}, {"title": "DNA-Replikation", "sub": "Aus einem Doppelstrang werden zwei.", "goals": ["Semikonservative Replikation erklären", "Leit- und Folgestrang korrekt orientieren"], "sections": [["Jeder alte Strang ist eine Vorlage", "Bei der semikonservativen Replikation enthält jede neue Doppelhelix einen alten und einen neu synthetisierten Strang. Helicase trennt die Stränge, Einzelstrang-bindende Proteine stabilisieren sie, und Topoisomerasen entspannen die DNA. Die Replikation beginnt an Ursprüngen und läuft häufig an zwei Gabeln in entgegengesetzte Richtungen."], ["Warum ein Strang stückweise entsteht", "DNA-Polymerasen verlängern ein vorhandenes 3′-OH-Ende. Sie synthetisieren immer 5′→3′ und lesen ihre Vorlage 3′→5′. Eine Primase stellt einen Primer bereit. Am Leitstrang erfolgt die Synthese in Richtung der Gabelbewegung weitgehend kontinuierlich; am Folgestrang entstehen Okazaki-Fragmente. Primer werden entfernt, Lücken mit DNA gefüllt und verbleibende Einzelstrangunterbrechungen durch Ligase geschlossen."], ["Wie man ein Modell testet", "Meselson und Stahl markierten bakterielle DNA mit schwerem Stickstoff und ließen die Zellen danach in leichtem Medium wachsen. Nach einer Replikationsrunde erschien eine Bande mittlerer Dichte; nach zwei Runden eine mittlere und eine leichte Bande. Das widerspricht konservativer Replikation bereits nach Runde 1 und einer rein dispersiven Replikation nach Runde 2."]], "deep": [["Genauigkeit entsteht in mehreren Stufen", "Passende Basenauswahl, die 3′→5′-Exonukleaseaktivität vieler replizierender Polymerasen und nachgelagerte Fehlpaarungsreparatur wirken zusammen. Korrekturlesen entfernt das zuletzt eingebaute falsche Nukleotid. Es ändert die Richtung der anschließenden DNA-Synthese nicht."], ["Lineare Enden sind ein Sonderproblem", "Nach Entfernung des äußersten Primers kann nicht jedes Ende vollständig aufgefüllt werden. Telomerase verwendet eine eigene RNA als Vorlage zur Verlängerung bestimmter Chromosomenenden. Sie ist eine reverse Transkriptase. Ihre Aktivität ist je nach Zelltyp reguliert; die Länge der Telomere ist keine einfache Uhr für die Lebensdauer eines gesamten Menschen."]], "trap": "Auch am Folgestrang synthetisiert die Polymerase ausschließlich 5′→3′.", "task": "Welcher Anteil der DNA-Moleküle ist nach drei ideal synchronen Replikationsrunden im leichten Medium noch hybrid?", "solution": "25 %. Aus einem ursprünglichen schweren Doppelstrang entstehen 8 Doppelstränge. Die beiden ursprünglichen schweren Einzelstränge bleiben jeweils in einem Hybridmolekül erhalten: 2/8 = 1/4. Der Anteil nimmt ab; die alten Stränge verschwinden im Idealmodell nicht.", "quiz": [["Was enthält ein semikonservativ repliziertes DNA-Molekül nach der ersten Runde?", ["Zwei neue Stränge", "Einen alten und einen neuen Strang", "Zwei zufällig zerstückelte Stränge"], 1, "Die ursprünglichen Einzelstränge bleiben erhalten und erhalten einen neuen Partner."], ["Wozu dient Ligase?", ["Verbinden benachbarter DNA-Abschnitte", "Öffnen der Doppelhelix", "Einbauen von Aminosäuren"], 0, "Ligase schließt Unterbrechungen im Zucker-Phosphat-Rückgrat."]], "terms": [["Semikonservativ", "Jede Tochter-Doppelhelix enthält einen alten und einen neuen Strang."], ["Okazaki-Fragment", "Kurzer neu synthetisierter DNA-Abschnitt am Folgestrang."], ["Telomerase", "Enzym, das mithilfe einer RNA-Vorlage Telomer-DNA verlängert."]], "lab": "replication"}, {"title": "Transkription", "sub": "Eine gezielte RNA-Abschrift entsteht.", "goals": ["Matrizenstrang und codierenden Strang unterscheiden", "Initiation, Elongation und Termination erklären"], "sections": [["Welcher Strang wird gelesen?", "RNA-Polymerase verwendet für ein bestimmtes Transkript einen DNA-Strang als Matrize. Sie liest diesen 3′→5′ und synthetisiert die RNA 5′→3′. Die RNA ist komplementär zur Matrize und entspricht dem codierenden DNA-Strang bis auf U statt T. Welcher DNA-Strang Matrize ist, hängt vom jeweiligen Gen ab."], ["Drei Phasen", "Bei der Initiation wird die Transkriptionsmaschinerie an einem Promotor zusammengebaut und die DNA lokal geöffnet. Während der Elongation verknüpft die Polymerase Ribonukleotide. Bei der Termination endet die Transkription. Anders als die DNA-Polymerase benötigt RNA-Polymerase keinen vorgefertigten Primer. Ein Startcodon legt nicht den Beginn der Transkription fest."], ["Bakterien und Eukaryoten", "Bei Bakterien hilft ein Sigmafaktor bei der Promotorerkennung. Transkription und Translation können räumlich und zeitlich gekoppelt sein. In Eukaryoten synthetisiert RNA-Polymerase II unter anderem Vorläufer von mRNAs. Allgemeine Transkriptionsfaktoren unterstützen die Initiation; regulatorische Faktoren und Chromatin beeinflussen die Aktivität. Die Translation folgt nach Verarbeitung und Export im Cytoplasma."]], "deep": [["Der Promotor ist kein übersetzter Startbefehl", "Der Transkriptionsstart wird mit +1 bezeichnet. Zwischen ihm und dem Startcodon kann eine 5′-untranslatierte Region liegen. Auch hinter dem Stopcodon folgt gewöhnlich eine 3′-untranslatierte Region. Diese RNA-Bereiche können Stabilität, Lokalisation und Translation beeinflussen."], ["Die Polymerase koordiniert Verarbeitung", "Die C-terminale Domäne der RNA-Polymerase II trägt wiederholte Aminosäuremotive. Unterschiedliche Phosphorylierungszustände koppeln Transkription an RNA-Verarbeitung. Bei vielen eukaryotischen mRNAs erfolgt die Spaltung des Transkripts vor dem tatsächlichen Ablösen der Polymerase."]], "trap": "Das Startcodon startet die Translation; der Promotor steuert den Beginn der Transkription.", "task": "Der Matrizenstrang lautet 3′-TAC GGA ATT-5′. Welche RNA entsteht?", "solution": "5′-AUG CCU UAA-3′. Die RNA ist komplementär und antiparallel zur Matrize. Der zugehörige codierende DNA-Strang lautet 5′-ATG CCT TAA-3′.", "quiz": [["In welcher Richtung wächst RNA?", ["3′→5′", "In beiden Richtungen", "5′→3′"], 2, "Neue Nukleotide werden an das 3′-Ende angehängt."], ["Was entspricht der mRNA-Sequenz bis auf T/U?", ["Der codierende DNA-Strang", "Die Matrize in gleicher Richtung", "Jeder beliebige DNA-Strang"], 0, "Codierender Strang und RNA stimmen in gleicher 5′→3′-Orientierung bis auf T/U überein."]], "terms": [["Promotor", "DNA-Bereich, an dem Transkriptionsinitiation organisiert wird."], ["Matrizenstrang", "Von der Polymerase gelesener DNA-Strang."], ["Transkript", "Durch Transkription hergestelltes RNA-Molekül."]], "lab": "sequence"}, {"title": "RNA-Prozessierung", "sub": "Aus Vorläufer-RNA wird nutzbare Information.", "goals": ["Cap, Poly(A)-Schwanz und Spleißen erklären", "Alternatives Spleißen von Mutation unterscheiden"], "sections": [["Schutz und Erkennung", "Viele eukaryotische prä-mRNAs erhalten früh eine modifizierte Guanosin-Kappe am 5′-Ende. Das 3′-Ende wird gespalten und meist polyadenyliert. Cap und Poly(A)-Schwanz beeinflussen unter anderem Stabilität, Export und Translation. Der Poly(A)-Schwanz wird enzymatisch angefügt und nicht als lange A-Folge von der DNA abgeschrieben. Es gibt Ausnahmen, etwa bestimmte Histon-mRNAs."], ["Introns entfernen, Exons verbinden", "Das Spleißosom erkennt Signale in der prä-mRNA, entfernt Introns und verbindet Exons. Ein Intron wird typischerweise als Lariat, eine lassoartige Struktur, herausgelöst. Exons sind Abschnitte, die in der reifen RNA erhalten bleiben. Sie können sowohl proteincodierende als auch untranslatierte Bereiche enthalten."], ["Ein Gen, mehrere Produkte", "Beim alternativen Spleißen werden unterschiedliche Kombinationen von Exons oder Spleißstellen genutzt. So entstehen aus demselben Gen mehrere RNA-Isoformen. Nicht jede Isoform führt zu einem stabilen oder funktionell unterschiedlichen Protein. Die Auswahl kann von Zelltyp, Entwicklungszustand und regulatorischen RNA-bindenden Proteinen abhängen."]], "deep": [["Zwei Umesterungen", "Zunächst greift die 2′-OH-Gruppe eines Adenosins am Verzweigungspunkt die 5′-Spleißstelle an. Es entsteht eine ungewöhnliche 2′–5′-Bindung. Anschließend greift die freie 3′-OH-Gruppe des ersten Exons die 3′-Spleißstelle an. Diese Reaktionen verbinden die Exons, ohne die RNA einfach wie mit einer Schere zu zerschneiden und anschließend beliebig zu kleben."], ["Qualitätskontrolle", "Ein vorzeitiges Stopcodon kann unter passenden Bedingungen den nonsense-vermittelten mRNA-Abbau auslösen. Dabei wird eine problematische RNA abgebaut, bevor viel verkürztes Protein entsteht. Spleißstellenvarianten können daher Proteinmengen beeinflussen, selbst wenn sie außerhalb der codierenden Exonsequenz liegen."]], "trap": "Exon bedeutet „in der reifen RNA enthalten“, nicht zwingend „wird in Protein übersetzt“.", "task": "Ein Gen besitzt die Exons 1, 2 und 3. In Muskelzellen wird Exon 2 ausgelassen. Liegt dadurch zwingend eine DNA-Mutation vor?", "solution": "Nein. Zelltypspezifisches alternatives Spleißen kann bei unveränderter DNA verschiedene RNA-Isoformen erzeugen. Ob das Protein funktionsfähig bleibt, hängt unter anderem davon ab, ob das Leseraster erhalten bleibt.", "quiz": [["Was wird beim Spleißen regulär entfernt?", ["Introns", "Alle Exons", "Die gesamte 5′-Region"], 0, "Introns werden entfernt; Exons zur reifen RNA verbunden."], ["Woher stammt der typische Poly(A)-Schwanz?", ["Aus der Translation", "Aus enzymatischem Anfügen nach RNA-Spaltung", "Aus der DNA-Replikation"], 1, "Eine Poly(A)-Polymerase fügt Adenosinreste an das RNA-Ende an."]], "terms": [["Spleißosom", "RNA-Protein-Komplex zur Entfernung vieler eukaryotischer Introns."], ["Exon", "Abschnitt, der nach dem Spleißen in der reifen RNA verbleibt."], ["Isoform", "Eine von mehreren molekularen Varianten eines Genprodukts."]], "lab": null}, {"title": "Translation & genetischer Code", "sub": "Aus Basentripletts entsteht ein Polypeptid.", "goals": ["Codons in Aminosäuren übersetzen", "Ribosom und tRNA funktionell erklären"], "sections": [["Drei Basen pro Codon", "Das Ribosom liest die mRNA in Tripletts, den Codons. 64 Codons sind möglich; im Standardcode codieren 61 für Aminosäuren, drei sind Stopcodons. AUG codiert Methionin und dient häufig als Startcodon. Der Code ist degeneriert: Mehrere Codons können dieselbe Aminosäure bedeuten. Ein einzelnes Codon bezeichnet im jeweiligen Code normalerweise eine bestimmte Aminosäure oder ein Stoppsignal."], ["Der Übersetzungsapparat", "Eine Aminoacyl-tRNA-Synthetase belädt die passende tRNA mit einer Aminosäure. Das Anticodon der tRNA paart antiparallel zum mRNA-Codon. Im Ribosom werden passende tRNAs aufgenommen, Peptidbindungen gebildet und die mRNA weiterbewegt. Die mRNA wird 5′→3′ gelesen; das Protein wächst vom Amino- zum Carboxyterminus."], ["Start, Verlängerung und Ende", "Die Initiation positioniert eine Initiator-tRNA am Startcodon. Bei der Elongation durchlaufen tRNAs A-, P- und E-Stelle. An einem Stopcodon binden Freisetzungsfaktoren statt einer normalen Aminoacyl-tRNA. Die Polypeptidkette wird freigesetzt. Faltung, Transport und Modifikationen können danach oder bereits während der Synthese folgen."]], "deep": [["Das Ribosom ist ein Riboenzym", "Das katalytische Zentrum für Peptidbindungen wird maßgeblich von ribosomaler RNA gebildet. Die große Untereinheit katalysiert die Reaktion, die kleine unterstützt das Ablesen der mRNA. GTP-abhängige Faktoren tragen zur Genauigkeit und gerichteten Bewegung bei. Die korrekte Beladung einer tRNA wird vor allem durch ihre Synthetase sichergestellt."], ["Der Code ist fast universell", "Mitochondrien und einige Organismen verwenden abweichende Codonzuordnungen. Außerdem können spezielle Signale die Aufnahme von Selenocystein oder programmierte Leserasterwechsel ermöglichen. Eine einfache Übersetzungstabelle bildet diese Sonderfälle nicht automatisch ab. Auch das erste AUG einer beliebigen Sequenz ist nicht zwingend ein biologischer Startpunkt."]], "trap": "Stopcodons codieren keine „Stopp-Aminosäure“.", "task": "Übersetze 5′-AUG GCU UGG UGA-3′ im Standardcode. Wie viele Aminosäuren enthält das Produkt?", "solution": "Methionin–Alanin–Tryptophan: drei Aminosäuren. UGA beendet die Translation und fügt keine vierte Aminosäure an.", "quiz": [["Was bedeutet degenerierter Code?", ["Ein Codon codiert beliebig viele Aminosäuren", "Mehrere Codons können dieselbe Aminosäure codieren", "Der Code ist unbrauchbar"], 1, "Redundanz betrifft mehrere Codons für dieselbe Aminosäure."], ["Wer verbindet eine tRNA mit der passenden Aminosäure?", ["Aminoacyl-tRNA-Synthetase", "DNA-Ligase", "Helicase"], 0, "Synthetasen erkennen Aminosäure und passende tRNA und können Korrekturmechanismen besitzen."]], "terms": [["Codon", "Drei aufeinanderfolgende Basen der mRNA im gewählten Leseraster."], ["Anticodon", "Basentriplett einer tRNA, das antiparallel zum Codon paart."], ["Translation", "Ribosomale Synthese eines Polypeptids anhand einer mRNA."]], "lab": "sequence"}, {"title": "Genregulation", "sub": "Welche Gene wann und wie stark aktiv sind.", "goals": ["Regulation auf mehreren Ebenen erkennen", "Das lac-Operon als Modell anwenden"], "sections": [["Nicht jedes Gen wird ständig benötigt", "Eine Zelle spart Ressourcen und reagiert auf Signale, indem sie Genprodukte gezielt herstellt oder abbaut. Regulation betrifft Chromatinzugänglichkeit, Transkriptionsbeginn, RNA-Verarbeitung, RNA-Stabilität, Translation und Proteinaktivität. Die gemessene mRNA-Menge sagt deshalb nicht unmittelbar, wie viel aktives Protein vorliegt."], ["Das lac-Operon", "Bei E. coli werden Gene für den Lactosestoffwechsel gemeinsam reguliert. Ohne Induktor bindet der Lac-Repressor am Operator und hemmt die Transkription. Aus Lactose gebildete Allolactose kann den Repressor inaktivieren. Niedrige Glucoseverfügbarkeit begünstigt über cAMP und CAP eine starke Aktivierung. Im vereinfachten Modell ist die Expression am höchsten bei Lactose vorhanden und Glucose knapp."], ["Eukaryotische Kombinationen", "Transkriptionsfaktoren erkennen DNA-Sequenzen. Enhancer können durch räumlichen Kontakt mit Promotoren wirken und weit entfernt liegen. Verschiedene Faktoren integrieren Signale. Dasselbe regulatorische Element kann je nach Zelltyp unterschiedlich wirken. Viele Merkmalsunterschiede entstehen durch veränderte Regulation statt durch veränderte Proteinsequenz."]], "deep": [["Cis und trans", "Cis-regulatorische Elemente sind DNA-Abschnitte, die typischerweise auf verknüpfte Gene wirken. Trans-wirkende Faktoren sind diffusible Moleküle wie Transkriptionsfaktoren oder regulatorische RNAs. Diese Unterscheidung erlaubt in genetischen Experimenten Rückschlüsse darauf, ob ein Defekt in einer DNA-Bindestelle oder in einem regulatorischen Produkt liegt."], ["Messung braucht mehrere Ebenen", "Ein Reporterexperiment kann regulatorische Aktivität sichtbar machen, bildet aber nicht automatisch den natürlichen Chromatinkontext ab. RNA-Sequenzierung erfasst RNA-Mengen, Proteomik Proteinmengen. Kausalität wird durch gezielte Störung, geeignete Kontrollen und möglichst eine Wiederherstellung des Phänotyps stärker gestützt."]], "trap": "Genregulation ist kein reiner Ein/Aus-Schalter; oft verändert sie die Wahrscheinlichkeit und Stärke der Expression.", "task": "Warum ist das lac-Operon bei vorhandener Lactose und viel Glucose im einfachen Modell weniger aktiv als bei Lactose und wenig Glucose?", "solution": "Lactose liefert den Induktor, sodass die Repression gelockert wird. Viel Glucose verringert aber die cAMP-CAP-vermittelte Aktivierung. Das Modell blendet zusätzliche Mechanismen wie die Induktor-Exklusion aus.", "quiz": [["Wann ist lac im vereinfachten Modell am stärksten aktiv?", ["Ohne Lactose, viel Glucose", "Mit Lactose, wenig Glucose", "Ohne beide Zucker"], 1, "Induktion und CAP-vermittelte Aktivierung fallen zusammen."], ["Was ist ein cis-regulatorisches Element?", ["Ein DNA-Abschnitt wie ein Enhancer", "Ein frei diffundierender Transkriptionsfaktor", "Jedes Ribosom"], 0, "Cis bezeichnet hier eine regulatorische DNA-Sequenz."]], "terms": [["Operon", "Gemeinsam regulierte bakterielle Gene, oft auf einer gemeinsamen mRNA."], ["Enhancer", "DNA-Element, das über regulatorische Faktoren Transkription steigern kann."], ["Transkriptionsfaktor", "Protein, das die Transkription beeinflusst."]], "lab": "lac"}, {"title": "Mendelsche Vererbung", "sub": "Wahrscheinlichkeiten statt Schicksal.", "goals": ["Genotyp- und Phänotypverhältnisse berechnen", "Die Voraussetzungen mendelscher Regeln benennen"], "sections": [["Zwei Allele an einem Locus", "Ein diploider Organismus trägt an einem autosomalen Locus gewöhnlich zwei Allele. AA und aa sind homozygot, Aa heterozygot. Bei vollständiger Dominanz zeigt Aa denselben betrachteten Phänotyp wie AA. Dominant bedeutet nicht stärker, besser oder häufiger. Bei der Gametenbildung werden die beiden Allele getrennt."], ["Kreuzungen systematisch lösen", "Bei Aa × Aa bildet jeder Elternteil die Gameten A und a mit je 50 % Wahrscheinlichkeit. Ein Kreuzungsschema liefert AA, Aa, Aa und aa. Das Genotypverhältnis ist 1:2:1, das Phänotypverhältnis bei vollständiger Dominanz 3:1. Diese Verhältnisse sind langfristige Erwartungen, keine Garantie für vier konkrete Nachkommen."], ["Mehrere Genorte", "Die Unabhängigkeitsregel gilt für ungekoppelte Loci beziehungsweise bei effektiv unabhängiger Verteilung. Für AaBb × AaBb ergibt sich bei vollständiger Dominanz, unabhängiger Verteilung und ohne weitere Wechselwirkungen das Phänotypverhältnis 9:3:3:1. Bei Kopplung oder Epistasie sind andere Verhältnisse zu erwarten."]], "deep": [["Wahrscheinlichkeit multiplizieren", "Bei unabhängigen Ereignissen gilt P(A und B) = P(A)·P(B). Bei sich ausschließenden Alternativen addiert man Wahrscheinlichkeiten. Für zwei heterozygote Eltern beträgt die Wahrscheinlichkeit für zwei aa-Kinder nacheinander 1/4·1/4 = 1/16, wenn die Ereignisse unabhängig sind. Das erste Kind verändert das biologische Risiko der nächsten Schwangerschaft nicht."], ["Beobachtung statistisch prüfen", "Eine Chi-Quadrat-Anpassungsprüfung vergleicht beobachtete mit erwarteten Häufigkeiten: χ² = Σ(O−E)²/E. Freiheitsgrade und Voraussetzungen sind zu beachten, insbesondere hinreichend große erwartete Häufigkeiten. Ein nicht signifikantes Ergebnis beweist das Modell nicht; es zeigt lediglich keine ausreichend starke Abweichung unter diesem Test."]], "trap": "25 % Risiko bedeutet nicht, dass unter vier Kindern genau eines den betreffenden Genotyp haben muss.", "task": "Bei Aa × aa: Welche Genotypen sind mit welchen Wahrscheinlichkeiten zu erwarten?", "solution": "Der erste Elternteil liefert A oder a, der zweite nur a. Erwartet werden 50 % Aa und 50 % aa. Bei vollständiger Dominanz zeigen 50 % den dominanten Phänotyp.", "quiz": [["Welches Genotypverhältnis ergibt Aa × Aa?", ["3:1", "1:2:1", "1:1"], 1, "AA:Aa:aa = 1:2:1. 3:1 beschreibt den Phänotyp bei vollständiger Dominanz."], ["Dominant bedeutet …", ["In der Bevölkerung am häufigsten", "Im Heterozygoten für den betrachteten Phänotyp wirksam", "Evolutionär überlegen"], 1, "Dominanz beschreibt eine Beziehung zwischen Allelen bezüglich eines Phänotyps."]], "terms": [["Heterozygot", "Zwei unterschiedliche Allele an einem betrachteten Locus."], ["Dominanz", "Beziehung, bei der ein Allel im Heterozygoten den betrachteten Phänotyp bestimmt."], ["Segregation", "Trennung von Allelen beziehungsweise homologen Chromosomen bei der Meiose."]], "lab": "cross"}, {"title": "Komplexe Erbgänge & Stammbäume", "sub": "Wenn das einfache 3:1 nicht genügt.", "goals": ["Kodominanz, Epistasie und Kopplung unterscheiden", "Stammbäume als Hypothesentest nutzen"], "sections": [["Mehr als vollständige Dominanz", "Bei intermediärer Vererbung liegt der heterozygote Phänotyp zwischen den homozygoten Ausprägungen. Bei Kodominanz sind beide Allelprodukte erkennbar, etwa A- und B-Antigene im AB0-System. Viele Merkmale werden durch mehrere Gene beeinflusst. Epistasie bezeichnet Wechselwirkungen zwischen Genorten, bei denen ein Locus die Wirkung eines anderen beeinflusst."], ["Stammbäume sorgfältig lesen", "Autosomal-dominante Merkmale können in aufeinanderfolgenden Generationen auftreten. Autosomal-rezessive Merkmale können bei nicht betroffenen heterozygoten Eltern auftreten. Bei X-chromosomaler Vererbung ist die Übertragung vom Vater auf einen Sohn über das X ausgeschlossen. Solche Muster sind Hinweise, keine alleinigen Beweise: kleine Familien, neue Varianten und unvollständige Penetranz erschweren die Zuordnung."], ["Gene auf demselben Chromosom", "Nahe Loci werden häufiger gemeinsam vererbt. Rekombinationshäufigkeiten aus Testkreuzungen erlauben genetische Kartierung. Für kleine Abstände entspricht 1 % Rekombinanten ungefähr 1 centiMorgan. Bei großen Abständen können mehrere Crossovers unbemerkt bleiben; eine beobachtete Rekombinationshäufigkeit von 50 % unterscheidet weit entfernte gekoppelte Loci nicht von ungekoppelten."]], "deep": [["Penetranz und Expressivität", "Penetranz ist der Anteil der Träger eines bestimmten Genotyps, der den definierten Phänotyp zeigt. Expressivität bezeichnet das Ausmaß der Ausprägung. Beide können durch Alter, Umwelt und weitere genetische Faktoren beeinflusst werden. Aus „Variante vorhanden“ folgt deshalb nicht immer „Merkmal sicher vorhanden“."], ["Bedingte Wahrscheinlichkeit", "Sind beide Eltern Aa und ein Kind zeigt bei vollständiger Penetranz nicht den rezessiven aa-Phänotyp, bleiben AA, Aa und aA als mögliche Ergebnisse. Zwei dieser drei Möglichkeiten sind heterozygot. Daher beträgt die bedingte Trägerwahrscheinlichkeit 2/3 statt 1/2. Die zusätzliche Information verändert den Nenner."]], "trap": "Ein unauffälliger Stammbaum schließt eine genetische Ursache nicht aus.", "task": "In einer Testkreuzung beobachtest du 420 AB, 420 ab, 80 Ab und 80 aB. Bestimme Rekombinationshäufigkeit und elterliche Allelanordnung.", "solution": "160 von 1000 Nachkommen sind rekombinant: 16 %. Die häufigen Klassen AB und ab entsprechen der Kopplungsphase AB/ab. Der einfache Kartenabstand beträgt näherungsweise 16 cM; nicht erfasste Mehrfach-Crossovers können den wahren Kartenabstand erhöhen.", "quiz": [["Gesundes Kind aus Aa × Aa bei vollständig rezessiver Ausprägung: Trägerwahrscheinlichkeit?", ["1/4", "1/2", "2/3"], 2, "Unter den nicht-aa-Ergebnissen sind zwei von drei heterozygot."], ["Was beschreibt Penetranz?", ["Den Anteil der Genotypträger mit dem definierten Phänotyp", "Die Häufigkeit eines Allels", "Den Abstand zwischen Genen"], 0, "Penetranz betrifft die tatsächliche Manifestation bei Trägern eines Genotyps."]], "terms": [["Epistasie", "Wechselwirkung zwischen Genorten bezüglich eines Phänotyps."], ["Penetranz", "Anteil der Träger eines Genotyps, der den definierten Phänotyp zeigt."], ["Genetische Kopplung", "Überzufällig gemeinsame Vererbung räumlich benachbarter Loci."]], "lab": "cross"}, {"title": "Mutation & DNA-Reparatur", "sub": "Veränderung, Fehlerkontrolle und Variation.", "goals": ["Varianten nach molekularer Wirkung unterscheiden", "Reparaturwege ihren Schäden zuordnen"], "sections": [["Was sich verändern kann", "Substitutionen ersetzen einzelne Basen. Insertionen fügen Basen ein, Deletionen entfernen sie. Größere Veränderungen umfassen Duplikationen, Inversionen und Translokationen. Eine Variante in einer codierenden Sequenz kann synonym sein, eine Aminosäure ändern oder ein vorzeitiges Stopcodon erzeugen. Eine Insertion oder Deletion verschiebt das Leseraster, wenn ihre Länge kein Vielfaches von drei ist."], ["Ort und Kontext entscheiden", "Varianten können auch Promotoren, Enhancer und Spleißstellen betreffen. Synonyme Varianten sind nicht zwangsläufig wirkungslos, weil sie beispielsweise Spleißen oder RNA-Struktur beeinflussen können. Keimbahnvarianten können an Nachkommen weitergegeben werden. Somatische Varianten entstehen in Körperzelllinien und werden normalerweise nicht über die Keimbahn vererbt."], ["Mehrere Reparaturwege", "Fehlpaarungsreparatur korrigiert bestimmte Fehler nach der Replikation. Basenexzisionsreparatur entfernt geschädigte Basen; Nukleotidexzisionsreparatur beseitigt unter anderem sperrige, die Helix verzerrende Schäden. Doppelstrangbrüche können durch homologe Rekombination oder Endverknüpfung repariert werden. DNA-Schaden und dauerhaft fixierte Mutation sind nicht dasselbe."]], "deep": [["Reparatur hat Bedingungen", "Homologe Rekombination verwendet eine homologe Vorlage, häufig die Schwesterchromatide, und ist daher insbesondere in S/G2 verfügbar. Klassische nicht-homologe Endverknüpfung verbindet Bruchenden ohne lange homologe Vorlage. Sie kann präzise sein, aber bei notwendiger Endverarbeitung kleine Insertionen oder Deletionen erzeugen."], ["Mutationen sind nicht bedarfsgesteuert", "Mutationen entstehen nicht zielgerichtet, weil ein Organismus eine bestimmte Anpassung benötigt. Mutationstypen und Raten sind allerdings nicht überall gleich. Selektion verändert anschließend, welche Varianten in einer Umgebung häufiger werden. Der Luria-Delbrück-Versuch unterscheidet vorbestehende zufällige Resistenzmutationen von einer rein bedarfsgesteuerten Entstehung."]], "trap": "„Mutation“ bedeutet nicht automatisch Krankheit; viele Varianten sind neutral oder kontextabhängig.", "task": "In eine codierende Sequenz wird direkt nach dem Startcodon eine einzelne Base eingefügt. Vergleiche die mögliche Wirkung mit einer Insertion von drei Basen.", "solution": "Eine einzelne Base verschiebt das nachfolgende Leseraster und verändert häufig viele Codons bis zu einem neuen Stoppsignal. Drei Basen erhalten das nachfolgende Leseraster, können aber dennoch eine oder mehrere lokale Aminosäurezuordnungen und die Proteinfunktion verändern.", "quiz": [["Welche Insertion verschiebt typischerweise das Leseraster?", ["3 Basen", "6 Basen", "1 Base"], 2, "Die Länge ist kein Vielfaches von drei."], ["Welche Aussage ist korrekt?", ["Jede synonyme Variante ist folgenlos", "Ein DNA-Schaden muss nicht als Mutation fixiert werden", "Jede Mutation wird an Kinder vererbt"], 1, "Reparatur kann einen Schaden beseitigen, bevor er zur dauerhaften Sequenzänderung wird."]], "terms": [["Missense-Variante", "Codierende Variante, die eine Aminosäurezuordnung verändert."], ["Leserasterverschiebung", "Verschiebung der Triplettgrenzen durch nicht durch drei teilbare Insertion oder Deletion."], ["Somatisch", "Körperzellen beziehungsweise ihre Zelllinien betreffend."]], "lab": "sequence"}, {"title": "Epigenetik & Entwicklung", "sub": "Stabile Zellzustände ohne neue DNA-Sequenz.", "goals": ["Epigenetische Zustände von Sequenzänderungen trennen", "Imprinting und X-Inaktivierung einordnen"], "sections": [["Genom gleich, Nutzung verschieden", "Während der Entwicklung entstehen unterschiedliche Zelltypen. Rückkopplungen zwischen Transkriptionsfaktoren, Chromatin und Signalwegen stabilisieren ihre Identität. Epigenetik untersucht Veränderungen der Genfunktion und ihrer Aufrechterhaltung, die nicht auf einer Veränderung der DNA-Basenfolge beruhen. Nicht jede vorübergehende Änderung der Genaktivität ist schon ein stabil vererbter epigenetischer Zustand."], ["Molekulare Mechanismen", "DNA-Methylierung, Histonmodifikationen und Chromatinorganisation können die Zugänglichkeit regulatorischer Bereiche beeinflussen. Bei Säugetieren ist Methylierung vieler CpG-reicher Promotorbereiche häufig mit geringer Transkription verbunden. Wirkung und Ursache hängen vom Kontext ab. Eine einzelne Histonmarkierung ist kein universeller Befehl, der jedes Gen zuverlässig an- oder ausschaltet."], ["Elterliche Herkunft kann zählen", "Beim genomischen Imprinting hängt die Expression bestimmter Gene von der elterlichen Herkunft ab. Bei der X-Inaktivierung wird in vielen Zellen von Säugetieren ein großer Teil eines X-Chromosoms stillgelegt; einige Gene entgehen der Inaktivierung. Zufällige Wahl und klonale Weitergabe tragen zu einem Mosaik von Zellpopulationen bei."]], "deep": [["Aufrechterhaltung und Zurücksetzung", "Nach der Replikation kann Erhaltungsmethylierung vorhandene Muster auf den neu synthetisierten Strang übertragen. In Keimbahn und früher Embryonalentwicklung finden jedoch weitreichende Reprogrammierungen statt. Zelluläre Vererbung über Mitosen ist deshalb nicht gleichbedeutend mit Vererbung über mehrere Organismengenerationen."], ["Transgenerationale Aussagen kritisch prüfen", "Eine Exposition einer schwangeren Person kann den Fötus und dessen entstehende Keimzellen direkt betreffen. Ein Effekt in Nachkommen beweist daher noch keine echte transgenerationale epigenetische Vererbung. Beim Menschen erschweren gemeinsame Umwelt, genetische Unterschiede und soziale Faktoren die kausale Zuordnung."]], "trap": "„Erfahrungen werden epigenetisch an alle Nachkommen vererbt“ ist keine wissenschaftlich haltbare Pauschalaussage.", "task": "Nach einem Umweltreiz verändert sich eine Histonmarkierung und zugleich steigt die Genexpression. Ist bewiesen, dass die Markierung den Anstieg verursacht?", "solution": "Nein. Die Markierung könnte Ursache, Folge oder Begleiterscheinung sein. Gezielte Manipulation der beteiligten Enzyme oder Bindestellen, zeitliche Analysen und passende Kontrollen sind nötig, um kausale Beiträge zu prüfen.", "quiz": [["Was ändert sich bei einem rein epigenetischen Vorgang definitionsgemäß nicht?", ["Unbedingt die Proteinmenge", "Die zugrunde liegende DNA-Basenfolge", "Jede Histonmodifikation"], 1, "Epigenetische Zustände beruhen nicht auf einer neuen DNA-Sequenz."], ["Was bedeutet Imprinting?", ["Alle Gene sind gleich aktiv", "Elterliche Herkunft beeinflusst die Expression bestimmter Gene", "Die DNA wird komplett entfernt"], 1, "Elternspezifische epigenetische Markierungen können zu allelspezifischer Expression führen."]], "terms": [["Epigenetik", "Untersuchung von Genfunktionszuständen und ihrer Aufrechterhaltung ohne Änderung der DNA-Sequenz."], ["Imprinting", "Elternherkunftsabhängige Regulation bestimmter Gene."], ["CpG", "Cytosin gefolgt von Guanin auf demselben Strang, verbunden über Phosphat."]], "lab": null}, {"title": "PCR, Gele & Sequenzierung", "sub": "Wie genetische Information untersucht wird.", "goals": ["PCR und Gelbanden erklären", "Messung von DNA und RNA unterscheiden"], "sections": [["Einen Abschnitt vervielfältigen", "PCR benötigt DNA-Vorlage, zwei geeignete Primer, eine thermostabile Polymerase, dNTPs und passende Pufferbedingungen. Durch Erhitzen werden Stränge getrennt, beim Abkühlen binden Primer, anschließend verlängert die Polymerase sie. Die Primer begrenzen den Zielbereich. Im Idealmodell verdoppelt sich die Zielmenge pro Zyklus; reale Reaktionen haben begrenzte Effizienz und erreichen ein Plateau."], ["DNA nach Länge trennen", "DNA ist wegen ihres Phosphatrückgrats negativ geladen und wandert im elektrischen Feld zum Pluspol. In einem Agarosegel bewegen sich kürzere lineare Fragmente meist schneller als längere. Eine Größenleiter erlaubt eine Längenabschätzung. Eine Bande zeigt nicht unmittelbar die Basensequenz und beweist nicht allein, dass das erwartete Produkt vorliegt."], ["Basen lesen und RNA messen", "Bei Sanger-Sequenzierung führen markierte Kettenabbruchnukleotide zu unterschiedlich langen Fragmenten. Hochdurchsatzverfahren lesen sehr viele Moleküle parallel; lange Reads können strukturelle Zusammenhänge besser auflösen. Für RNA-Analysen wird RNA häufig zunächst in cDNA umgeschrieben. RT-PCR bezeichnet diesen Reverse-Transkriptionsschritt; qPCR verfolgt eine Amplifikation quantitativ über Fluoreszenz."]], "deep": [["Kontrollen gehören zum Ergebnis", "Eine Negativkontrolle ohne Vorlage prüft Kontamination, eine Positivkontrolle die grundsätzliche Funktionsfähigkeit. Bei RNA-Analysen prüft eine Kontrolle ohne reverse Transkriptase mögliche DNA-Verunreinigung. Biologische Replikate erfassen biologische Streuung; technische Wiederholungen schätzen Messstreuung und ersetzen keine unabhängigen Proben."], ["qPCR interpretieren", "Bei gleicher Effizienz und geeigneter Normalisierung kann eine Cq-Differenz von 1 ungefähr einen Faktor 2 Ausgangsmengenunterschied bedeuten. Die ΔΔCq-Methode setzt insbesondere vergleichbare Amplifikationseffizienzen voraus. Ein niedriger Cq-Wert ist ohne Kontrollen, Referenz und Probenkontext kein eigenständiger biologischer Befund."]], "trap": "PCR vervielfältigt einen definierten Abschnitt; sie „liest“ nicht automatisch dessen Sequenz.", "task": "Eine Probe erzeugt eine erwartete 500-bp-Bande. Auch die Negativkontrolle ohne DNA zeigt dieselbe Bande. Wie bewertest du das Experiment?", "solution": "Eine Kontamination oder unspezifische Reaktion ist möglich. Das Probensignal lässt sich nicht zuverlässig als spezifischer Nachweis interpretieren. Ursache prüfen und mit sauberen Reagenzien, geeigneten Kontrollen sowie gegebenenfalls einer Sequenzbestätigung wiederholen.", "quiz": [["Wohin wandert DNA im üblichen Agarosegel?", ["Zum Pluspol", "Zum Minuspol", "Sie ist ungeladen"], 0, "Die Phosphatgruppen verleihen DNA eine negative Ladung."], ["Wozu dient eine Kontrolle ohne reverse Transkriptase?", ["Nachweis aller Proteine", "Erkennung von DNA-Verunreinigung in RNA-Analysen", "Erhöhung der Mutationsrate"], 1, "Ein Signal ohne RT kann von vorhandener DNA stammen."]], "terms": [["Primer", "Kurze Nukleinsäure, die ein freies 3′-OH-Ende für Synthese bereitstellt."], ["PCR", "Zyklische gezielte DNA-Amplifikation durch Polymerase-Kettenreaktion."], ["cDNA", "Durch reverse Transkription von RNA hergestellte DNA."]], "lab": "pcr"}, {"title": "Gentechnik & CRISPR", "sub": "Gene verändern und Funktionen prüfen.", "goals": ["Klonierung und Genomeditierung unterscheiden", "Grenzen und Kontrollen bei CRISPR benennen"], "sections": [["DNA gezielt kombinieren", "Molekulare Klonierung verbindet einen DNA-Abschnitt mit einem Vektor, etwa einem Plasmid. Restriktionsenzyme und Ligase oder andere Assemblierungsverfahren helfen beim Zusammenbau. Ein Vektor kann Replikationsursprung, Selektionsmarker und regulatorische Elemente enthalten. Nach Übertragung in Zellen muss geprüft werden, ob die gewünschte Sequenz korrekt vorliegt."], ["CRISPR-Cas als Werkzeug", "Eine Leit-RNA lenkt eine passende Cas-Nuklease zu einer Zielsequenz. Beim häufig genutzten SpCas9 ist zusätzlich ein geeignetes PAM-Motiv erforderlich, typischerweise NGG. Die Nuklease erzeugt einen DNA-Bruch. Das Ergebnis entsteht durch die zelluläre Reparatur: kleine Insertionen oder Deletionen sind häufig; eine präzise Änderung kann unter geeigneten Bedingungen eine Reparaturvorlage nutzen."], ["Veränderung ist nicht automatisch Heilung", "Eine erfolgreiche Editierung muss auf Zielsequenz, unerwünschte Änderungen und biologische Wirkung untersucht werden. Lieferung in die richtigen Zellen, Mosaikbildung und funktionelle Nebenwirkungen sind zentrale Herausforderungen. Somatische Eingriffe betreffen behandelte Zelllinien; vererbbare Eingriffe in die Keimbahn haben andere biologische und ethische Folgen."]], "deep": [["Andere Editierungsprinzipien", "Baseneditoren koppeln DNA-erkennende Systeme an chemisch verändernde Enzyme und ermöglichen bestimmte Basenumwandlungen ohne klassischen Doppelstrangbruch. Prime Editing nutzt eine reverse Transkriptase und eine erweiterte Leit-RNA. Diese Verfahren erweitern die Möglichkeiten, besitzen aber eigene Einschränkungen und Fehlerprofile."], ["Funktion kausal untersuchen", "Ein Knockout kann Hinweise liefern, ob ein Gen für einen beobachteten Prozess erforderlich ist. Kompensation und Nebeneffekte bleiben möglich. Mehrere unabhängige Leit-RNAs, Sequenzprüfung und ein Rettungsexperiment stärken die Interpretation. Wiederherstellung durch das intakte Gen hilft, einen spezifischen Zusammenhang zu begründen."]], "trap": "Eine Cas9-Schere fügt nicht von selbst exakt die gewünschte neue Sequenz ein.", "task": "Nach einer CRISPR-Behandlung sterben Zellen. Welche Kontrollen helfen zu prüfen, ob dies spezifisch am ausgeschalteten Gen liegt?", "solution": "Unbehandelte und nicht zielende Kontrollen, mehrere unabhängige Leit-RNAs, Prüfung der tatsächlichen Editierung sowie ein Rettungsexperiment mit funktionsfähigem Gen. Auch die Belastung durch die Behandlung selbst und mögliche Off-Target-Effekte müssen berücksichtigt werden.", "quiz": [["Was bestimmt das Ergebnis nach einem Cas9-Doppelstrangbruch wesentlich mit?", ["Die zellulären Reparaturwege", "Nur die Farbe des Mediums", "Ausschließlich die RNA-Länge"], 0, "Die Nuklease erzeugt den Bruch; Reparatur bestimmt viele resultierende Sequenzänderungen."], ["Was stärkt eine spezifische Knockout-Interpretation?", ["Nur eine einzelne behandelte Zelle", "Ein Rettungsexperiment", "Verzicht auf Sequenzprüfung"], 1, "Die Wiederherstellung des Phänotyps durch das intakte Gen unterstützt einen kausalen Zusammenhang."]], "terms": [["Vektor", "Trägermolekül zur Übertragung beziehungsweise Vermehrung genetischen Materials."], ["PAM", "Kurzes Motiv, das bestimmte Cas-Systeme neben der Zielsequenz benötigen."], ["Knockout", "Gezielte Ausschaltung einer Genfunktion."]], "lab": null}, {"title": "Medizinische Genetik & Krebs", "sub": "Vom molekularen Befund zur vorsichtigen Interpretation.", "goals": ["Monogene und multifaktorielle Ursachen trennen", "Tumorsuppressoren und Onkogene vergleichen"], "sections": [["Eine Variante braucht Kontext", "Genetische Befunde können krankheitsverursachend, gutartig oder unklar sein. Die Interpretation berücksichtigt Häufigkeit, Familiensegregation, funktionelle Daten und weitere Evidenz. Eine Variante unklarer Signifikanz ist kein gesicherter Krankheitsnachweis. Auch bei einer ursächlichen Variante können Penetranz und Ausprägung variieren. Die Beispiele hier dienen dem Lernen, nicht einer persönlichen Diagnose."], ["Viele Krankheiten sind multifaktoriell", "Bei monogenen Erkrankungen kann eine Veränderung in einem einzelnen Gen entscheidend sein. Bei komplexen Erkrankungen tragen häufig viele Varianten mit kleinen Effekten und Umweltfaktoren bei. Ein erhöhtes relatives Risiko sagt ohne das Ausgangsrisiko wenig über die absolute Wahrscheinlichkeit aus. Genetisch beeinflusst bedeutet nicht unvermeidbar."], ["Krebs als somatische Evolution", "Tumoren entstehen durch Veränderungen, die Zellwachstum, Überleben und weitere Eigenschaften beeinflussen. Onkogene können durch aktivierende Veränderungen Wachstumssignale verstärken. Tumorsuppressoren begrenzen normalerweise solche Prozesse; Funktionsverlust kann die Tumorentwicklung begünstigen. Zellen mit vorteilhaften Veränderungen können sich im Gewebe durchsetzen. Nicht jede Tumorvariante treibt das Wachstum an."]], "deep": [["Zwei Treffer, aber keine starre Universalregel", "Bei manchen Tumorsuppressorgenen müssen beide Allelkopien funktionell beeinträchtigt sein. Eine ererbte Veränderung kann den ersten Treffer darstellen, ein somatisches Ereignis den zweiten. Es gibt Ausnahmen, unter anderem Haploinsuffizienz und dominant-negative Wirkungen. Dominanz auf Ebene einer familiären Veranlagung ist nicht dasselbe wie Dominanz auf Ebene einer einzelnen Zelle."], ["Treiber und Passagiere", "Treiberveränderungen tragen kausal zur klonalen Fitness bei, Passagierveränderungen werden mitgeführt. Tumoren sind heterogen; unter Therapie können resistente Zellklone selektiert werden. Die bloße Häufigkeit einer Mutation ist ein Hinweis, ersetzt aber keine funktionelle und kontextbezogene Bewertung."]], "trap": "Ein doppelt so hohes Risiko bedeutet nicht automatisch eine hohe absolute Erkrankungswahrscheinlichkeit.", "task": "In einem vereinfachten Beispiel steigt ein absolutes Risiko von 1 % auf 2 %. Beschreibe absolute und relative Veränderung.", "solution": "Der absolute Anstieg beträgt 1 Prozentpunkt. Das relative Risiko beträgt 2, also ein relativer Anstieg um 100 %. Beide Darstellungen sind rechnerisch korrekt, erzeugen aber ohne Kontext sehr unterschiedliche Eindrücke.", "quiz": [["Eine Variante unklarer Signifikanz bedeutet …", ["Eine gesicherte Diagnose", "Unzureichende Evidenz für eine eindeutige Einstufung", "Garantierte Harmlosigkeit"], 1, "Unklarheit ist weder ein Krankheitsbeweis noch ein Entwarnungsbeweis."], ["Was ist typisch für ein Onkogen?", ["Aktivierung kann Wachstum fördern", "Es ist immer ein Reparaturenzym", "Es kommt ausschließlich in Viren vor"], 0, "Onkogene entstehen häufig durch aktivierende Veränderungen von Protoonkogenen."]], "terms": [["Onkogen", "Gen, dessen veränderte oder übermäßige Aktivität Tumorentwicklung fördern kann."], ["Tumorsuppressor", "Gen, dessen Funktion tumorhemmend wirkt."], ["Mosaik", "Vorliegen genetisch unterschiedlicher Zellpopulationen aus einer Zygote."]], "lab": null}, {"title": "Populationsgenetik & Evolution", "sub": "Was mit Allelen über Generationen geschieht.", "goals": ["Allelfrequenzen aus Genotypzahlen berechnen", "Hardy-Weinberg als Nullmodell anwenden"], "sections": [["Von Individuen zur Population", "Populationen enthalten Allele mit bestimmten Häufigkeiten. Für einen autosomalen Locus mit A und a gilt p + q = 1. Die Häufigkeit von A ist p = (2·Anzahl AA + Anzahl Aa)/(2·Anzahl Individuen). Das ist eine Zählbeziehung und setzt für sich genommen noch kein Hardy-Weinberg-Gleichgewicht voraus."], ["Ein bewusst einfaches Nullmodell", "Bei zufälliger Paarung und geeigneten weiteren Modellbedingungen ergeben sich p² für AA, 2pq für Aa und q² für aa. Zur Konstanz der Allelfrequenzen über Generationen werden unter anderem keine Selektion, Mutation oder Migration sowie eine sehr große Population angenommen. Abweichungen helfen, biologische Prozesse oder Datenprobleme zu untersuchen."], ["Kräfte der Evolution", "Mutation erzeugt neue Varianten, Migration transportiert sie zwischen Populationen. Selektion verändert Häufigkeiten durch Unterschiede im Fortpflanzungserfolg. Genetische Drift ist zufällige Frequenzänderung durch endliche Stichproben und wirkt besonders stark bei kleinen effektiven Populationsgrößen. Drift kann auch vorteilhafte Varianten verlieren lassen. Evolution hat kein vorgegebenes Ziel."]], "deep": [["Inzucht verändert zunächst Genotypverhältnisse", "In einem einfachen Modell beschreibt F den Inzuchtkoeffizienten. Die Heterozygotenhäufigkeit sinkt auf 2pq(1−F), die Homozygotenhäufigkeiten steigen auf p²+Fpq beziehungsweise q²+Fpq. Die Allelfrequenzen müssen dadurch allein nicht sofort verändert werden."], ["Selektion quantitativ", "Setzt man relative Fitnesswerte wAA, wAa und waa an, ergeben sich nach Selektion Genotypanteile proportional zu p²wAA, 2pqwAa und q²waa. Nach Division durch die mittlere Fitness lassen sich neue Allelfrequenzen berechnen. Das Ergebnis hängt von Dominanz, Fitnessunterschieden und Ausgangshäufigkeit ab."]], "trap": "Hardy-Weinberg ist ein Referenzmodell mit Annahmen, kein Gesetz, das jede reale Population erfüllen muss.", "task": "Unter Hardy-Weinberg beträgt die Häufigkeit des rezessiven aa-Genotyps 0,01. Wie häufig sind heterozygote Träger?", "solution": "q² = 0,01, also q = 0,1 und p = 0,9. Damit 2pq = 0,18 = 18 %. Ohne die Modellannahmen lässt sich die Trägerhäufigkeit nicht einfach aus q² bestimmen.", "quiz": [["Bei p = 0,7 beträgt q …", ["0,49", "0,3", "0,7"], 1, "Für genau zwei Allele gilt p + q = 1."], ["Was ist genetische Drift?", ["Zufällige Änderung von Allelfrequenzen in endlichen Populationen", "Gezielte Verbesserung von Organismen", "Immer gerichtete Selektion"], 0, "Drift beruht auf zufälliger Stichprobenziehung zwischen Generationen."]], "terms": [["Allelfrequenz", "Anteil eines Allels an den Allelkopien eines Locus in einer Population."], ["Genetische Drift", "Zufällige Veränderung von Allelfrequenzen in endlichen Populationen."], ["Fitness", "Relativer Beitrag zum Fortpflanzungserfolg im betrachteten Kontext."]], "lab": "population"}, {"title": "Quantitative Genetik & Genomik", "sub": "Viele Gene, viele Daten, begrenzte Vorhersagen.", "goals": ["Heritabilität korrekt interpretieren", "Assoziation von Kausalität unterscheiden"], "sections": [["Kontinuierliche Merkmale", "Körpergröße und viele andere Merkmale variieren kontinuierlich. Häufig wirken viele genetische Varianten, Umweltbedingungen und ihre Wechselwirkungen zusammen. Quantitative Genetik untersucht Unterschiede zwischen Individuen mit statistischen Modellen. Ein Merkmal kann stark genetisch beeinflusst und zugleich deutlich durch die Umwelt veränderbar sein."], ["Was Heritabilität wirklich bedeutet", "Heritabilität ist ein Verhältnis von Varianzkomponenten in einer bestimmten Population und Umwelt. Im weiten Sinn ist H² = VG/VP, im engen Sinn h² = VA/VP, wobei VA die additive genetische Varianz bezeichnet. Ein Wert von 0,8 bedeutet nicht, dass 80 % des Merkmals einer einzelnen Person genetisch festgelegt sind."], ["Das Genom im großen Maßstab", "Genomweite Assoziationsstudien prüfen statistische Zusammenhänge zwischen Varianten und Merkmalen. RNA-Sequenzierung untersucht Transkriptmengen; andere Verfahren messen Chromatinzugänglichkeit oder Proteinbestände. Viele parallele Tests, technische Störeinflüsse und Unterschiede in der Populationsstruktur müssen berücksichtigt werden. Ein signifikanter Marker ist nicht automatisch die ursächliche Variante."]], "deep": [["Kopplungsungleichgewicht", "Allele an unterschiedlichen Loci können in einer Population statistisch häufiger gemeinsam vorkommen als bei Unabhängigkeit erwartet. Daher kann ein getesteter Marker einen kausalen Nachbarn markieren. Feinkartierung und funktionelle Experimente helfen bei der Zuordnung. Große Stichproben allein beseitigen keine systematischen Verzerrungen."], ["Vorhersagen übertragen sich nicht beliebig", "Polygene Scores fassen gewichtete Beiträge vieler Varianten zusammen. Ihre Aussagekraft hängt von Trainingsdaten, untersuchter Population, Umwelt und gemessenem Phänotyp ab. Eine Vorhersagegüte in einer Stichprobe garantiert keine vergleichbare Güte in einer anderen. Genetische Gruppenzuschreibungen ersetzen keine individuelle Evidenz."]], "trap": "Hohe Heritabilität bedeutet weder Unveränderbarkeit noch eine Erklärung für Unterschiede zwischen beliebigen Gruppen.", "task": "In einer sehr einheitlichen Umwelt steigt der Anteil genetisch erklärter Varianz. Beweist dies, dass Umweltmaßnahmen wirkungslos sind?", "solution": "Nein. Eine geringe Umweltstreuung in der untersuchten Population kann die relative genetische Varianz erhöhen. Eine gezielte neue Umweltänderung kann dennoch den Mittelwert des Merkmals erheblich verändern. Varianz innerhalb einer Population und Veränderbarkeit sind verschiedene Fragen.", "quiz": [["h² = 0,6 bedeutet …", ["60 % meines Körpers sind genetisch festgelegt", "60 % der phänotypischen Varianz werden im Modell additiver genetischer Varianz zugerechnet", "Umwelt hat keine Wirkung"], 1, "Heritabilität beschreibt Varianz in einer bestimmten Population und Umwelt."], ["Ein GWAS-Treffer beweist unmittelbar …", ["Eine kausale Variante", "Einen statistischen Zusammenhang unter dem verwendeten Modell", "Einen Therapieerfolg"], 1, "Assoziation kann durch Kopplungsungleichgewicht oder Störfaktoren zustande kommen."]], "terms": [["Heritabilität", "Populations- und umweltspezifischer Anteil genetischer Varianz an phänotypischer Varianz."], ["GWAS", "Genomweite Assoziationsstudie zu Varianten und einem Merkmal."], ["Kopplungsungleichgewicht", "Statistische Nicht-Unabhängigkeit von Allelen an verschiedenen Loci."]], "lab": null}, {"title": "Experimente verstehen & bewerten", "sub": "Denken wie eine Genetikerin oder ein Genetiker.", "goals": ["Hypothesen falsifizierbar formulieren", "Kontrollen, Replikate und Unsicherheit bewerten"], "sections": [["Aus einer Idee eine prüfbare Aussage machen", "Eine Hypothese muss unterschiedliche erwartete Beobachtungen zulassen, je nachdem, ob sie zutrifft. „Gen X beeinflusst Prozess Y“ wird konkret, wenn eine definierte Veränderung von X eine messbare Änderung von Y vorhersagt. Vorab festgelegte Endpunkte verhindern, dass hinterher nur passende Ergebnisse ausgewählt werden."], ["Ein guter Vergleich isoliert eine Ursache", "Kontroll- und Versuchsgruppen sollen sich möglichst nur in der interessierenden Manipulation unterscheiden. Randomisierung reduziert systematische Gruppenunterschiede, Verblindung vermindert Erwartungseffekte. Unabhängige biologische Replikate sind nötig, um Streuung und Reproduzierbarkeit zu beurteilen. Zehn Messungen derselben Zellkultur sind nicht zehn unabhängige Kulturen."], ["Ergebnisse begrenzen Aussagen", "Effektgröße, Unsicherheitsintervall und biologischer Kontext sind ebenso wichtig wie ein p-Wert. Ein p-Wert beschreibt unter einem Nullmodell die Wahrscheinlichkeit mindestens so extremer Daten; er ist nicht die Wahrscheinlichkeit, dass die Hypothese falsch ist. Fehlende statistische Signifikanz ist nicht automatisch Gleichheit. Ein Zusammenhang wird durch verschiedene unabhängige Methoden überzeugender."]], "deep": [["Notwendigkeit und Hinreichendheit", "Wenn Ausschalten von X einen Prozess verhindert, spricht dies unter geeigneten Kontrollen für die Notwendigkeit von X. Wenn Einbringen von X einen Prozess auslöst, kann das für Hinreichendheit unter den getesteten Bedingungen sprechen. Beides gilt kontextabhängig. Überexpression kann künstliche Effekte erzeugen; ein Rettungsexperiment und physiologische Dosierungen sind besonders wertvoll."], ["Ein integratives Genetik-Experiment", "Angenommen, eine Promotorvariante korreliert mit niedrigeren RNA-Mengen. Prüfe zunächst Sequenz und Messqualität. Vergleiche Reporter mit beiden Allelen, editiere anschließend den natürlichen Locus in sonst vergleichbaren Zellen und miss RNA sowie Protein. Mehrere Klone, geeignete Kontrollen und Rückeditierung helfen, andere Ursachen einzugrenzen."]], "trap": "Eine schöne Grafik, ein kleiner p-Wert und viele technische Wiederholungen ersetzen kein sauberes Versuchsdesign.", "task": "Nach CRISPR-Editierung eines Promotors sinkt die RNA-Menge um 40 %. Formuliere eine plausible Erklärung, eine Alternative und einen Folgetest.", "solution": "Erklärung: Die Änderung schwächt die Bindung eines aktivierenden Faktors. Alternative: Ein anderer Unterschied des Zellklons oder eine Off-Target-Veränderung beeinflusst die RNA-Menge. Folgetest: mehrere unabhängige editierte Klone und Kontrollen vergleichen, Rückeditierung durchführen und Bindung des Faktors sowie Proteinmenge messen.", "quiz": [["Was ist ein biologisches Replikat?", ["Eine erneute Messung desselben Röhrchens", "Eine unabhängige biologische Probe oder experimentelle Einheit", "Ein zweites Foto desselben Gels"], 1, "Unabhängige biologische Einheiten erlauben Aussagen über biologische Streuung."], ["Was zeigt ein Rettungsexperiment?", ["Es kann eine spezifische kausale Zuordnung stärken", "Es beweist jedes denkbare Modell", "Es ersetzt alle Kontrollen"], 0, "Die Wiederherstellung einer Funktion durch gezielte Rückgabe des Genprodukts stützt die Interpretation."]], "terms": [["Nullhypothese", "Statistisches Referenzmodell, gegen das die Daten geprüft werden."], ["Biologisches Replikat", "Unabhängige biologische experimentelle Einheit."], ["Rettungsexperiment", "Wiederherstellung einer gestörten Funktion durch gezielte Ergänzung oder Korrektur."]], "lab": null}]</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('curriculum').textContent),KEY='genetik-leonard-v1';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=['Das Fundament','Information in Aktion','Vererbung & Veränderung','Werkzeuge & Forschung','Gene im großen Bild'];

const group=i=>i<5?0:i<10?1:i<14?2:i<17?3:4;
const fresh=()=>({version:1,done:[],bookmarks:[],notes:{},answers:{},cards:{},exams:[],last:0});
let state=fresh(),storageOK=true,view='home',current=0,filter='all',lab='sequence',exam=null,flashIndex=null,flashMode='due';
function validState(x){if(!x||x.version!==1)throw Error('Unbekanntes Datenformat.');const r=fresh();for(const k of ['done','bookmarks']){if(!Array.isArray(x[k]))throw Error('Ungültige Kapitelliste.');r[k]=[...new Set(x[k].filter(v=>Number.isInteger(v)&&v>=0&&v<D.length))];}for(const [k,v]of Object.entries(x.notes||{})){if(/^\d+$/.test(k)&&+k<20&&typeof v==='string')r.notes[k]=v.slice(0,20000);}for(const[k,v]of Object.entries(x.answers||{})){if(/^\d+-[01]$/.test(k)&&+k.split('-')[0]<20&&Number.isInteger(v)&&v>=0&&v<3)r.answers[k]=v;}for(const[k,v]of Object.entries(x.cards||{})){if(/^\d+$/.test(k)&&+k<60&&v&&Number.isFinite(v.due)&&Number.isFinite(v.interval)&&v.interval>=0&&v.interval<=365)r.cards[k]={due:v.due,interval:v.interval};}r.exams=Array.isArray(x.exams)?x.exams.filter(v=>v&&Number.isFinite(v.date)&&Number.isInteger(v.score)&&v.score>=0&&v.score<=10).slice(-50):[];r.last=Number.isInteger(x.last)&&x.last>=0&&x.last<20?x.last:0;return r;}
try{const raw=localStorage.getItem(KEY);if(raw)state=validState(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;$('#storage-alert').classList.remove('hidden');}
