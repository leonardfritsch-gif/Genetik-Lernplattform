const cards=D.flatMap((c,ci)=>c.terms.map(t=>({q:t[0],a:t[1],ci})));
function dueCards(){return cards.map((c,i)=>i).filter(i=>!state.cards[i]||state.cards[i].due<=Date.now());}
function side(){const n=state.done.length;$('#side-progress').innerHTML=`<div class="row between"><strong>Dein Lernpfad</strong><span>${n}/20</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${n}" aria-label="Bearbeitete Kapitel"><span style="width:${n*5}%"></span></div><span class="muted">${n*5} % als bearbeitet markiert</span>`;$$('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view||(view==='chapter'&&b.dataset.view==='path'));if(b.classList.contains('active'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
const footer=()=>`<footer class="footer"><div class="row between"><span>Genetik verstehen – ein Lernprojekt von Leonard Fritsch</span><button onclick="go('sources')">Quellen, Modellgrenzen & Nutzung</button></div></footer>`;
function mount(html,focus=true){$('#main').innerHTML=html+footer();side();$('#breadcrumb').textContent=({home:'Dein Genetik-Campus',path:'Dein Weg vom Einstieg zur Vertiefung',chapter:'Lernpfad / Kapitel '+String(current+1).padStart(2,'0'),lab:'Ausprobieren. Beobachten. Verstehen.',cards:'Wissen aktiv abrufen',exam:'Wissen anwenden',glossary:'Begriffe & Zusammenhänge',settings:'Dein persönlicher Lernstand',sources:'Wissenschaftliche Orientierung',search:'Suche im gesamten Kurs'})[view]||'';if(focus){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}}
function go(v,arg,fromHash=false){view=v;if(v==='chapter'){current=Math.max(0,Math.min(19,Number(arg)||0));state.last=current;save();}if(v==='lab'&&arg)lab=arg;if(v!=='search'&&!fromHash){const h=v==='chapter'?'chapter/'+current:v==='lab'?'lab/'+lab:v;history.replaceState(null,'','#'+h);}({home:renderHome,path:renderPath,chapter:renderChapter,lab:renderLab,cards:renderCards,exam:renderExam,glossary:renderGlossary,settings:renderSettings,sources:renderSources,search:()=>renderSearch(arg)})[v]?.();}
function bookmark(i){state.bookmarks=state.bookmarks.includes(i)?state.bookmarks.filter(n=>n!==i):[...state.bookmarks,i];save();if(view==='chapter')renderChapter(false);else if(view==='path')renderPath(false);else if(view==='search')renderSearch($('#global-search').value,false);else renderHome(false);}
function chapterCard(c,i){return `<article class="card chapter-card" style="--tint:${colors[group(i)]}"><div class="row between"><div class="row"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="stage muted">${groups[group(i)]}</span></div><button class="bookmark ${state.bookmarks.includes(i)?'on':''}" onclick="bookmark(${i})" aria-label="${state.bookmarks.includes(i)?'Lesezeichen entfernen':'Lesezeichen setzen'}: ${esc(c.title)}" aria-pressed="${state.bookmarks.includes(i)}">${state.bookmarks.includes(i)?'★':'☆'}</button></div><h3>${esc(c.title)}</h3><p>${esc(c.sub)}</p><div class="row between"><button class="btn small" onclick="go('chapter',${i})">Kapitel öffnen <span aria-hidden="true">↗</span></button>${state.done.includes(i)?'<span class="pill">✓ Bearbeitet</span>':'<span class="small muted">Basis + Uni-Vertiefung</span>'}</div></article>`;}
function dnaArt(){let s='<svg viewBox="0 0 320 310" role="img" aria-label="Stilisierte DNA-Doppelhelix"><circle cx="157" cy="151" r="123" fill="#dce7ca"/><circle cx="222" cy="85" r="44" fill="#e5d8f2"/>';let p1=[],p2=[];for(let i=0;i<23;i++){let y=25+i*11,x=160+64*Math.sin(i*.38),xx=320-x;p1.push(`${x},${y}`);p2.push(`${xx},${y}`);s+=`<line x1="${x}" y1="${y}" x2="${xx}" y2="${y}" stroke="${i%2?'#a3bd84':'#b7a0d4'}" stroke-width="9" stroke-linecap="round"/>`;}s+=`<polyline points="${p1.join(' ')}" fill="none" stroke="#295c46" stroke-width="10" stroke-linecap="round"/><polyline points="${p2.join(' ')}" fill="none" stroke="#7a5c9d" stroke-width="10" stroke-linecap="round"/></svg>`;return s;}
function renderHome(f=true){const next=state.done.length===20?state.last:Math.min(state.last,19);mount(`<section class="hero"><div><div class="eyebrow">Dein interaktiver Genetik-Campus</div><h1>Das Leben<br>verstehen.<br><span style="color:#6f8c49">Base für Base.</span></h1><p>Von deiner ersten Zelle bis zur Genomforschung. Entdecke Zusammenhänge, teste Ideen und mach Wissen zu Verständnis.</p><div class="row"><button class="btn primary" onclick="go('chapter',${next})">${state.done.length?'Weiterlernen':'Lernreise starten'} <span aria-hidden="true">→</span></button><button class="btn" onclick="go('lab')">Labor entdecken</button></div><p class="credit">Genetik verstehen – ein Lernprojekt von Leonard Fritsch</p></div><div class="hero-art">${dnaArt()}<span class="art-tag one">A–T · G–C</span><span class="art-tag two">Kleine Bausteine. Große Fragen.</span></div></section><section class="stats" aria-label="Lernübersicht"><div class="stat"><div class="stat-icon" style="background:var(--lime)">≡</div><div><strong>${state.done.length}<span> / 20</span></strong><span>Kapitel bearbeitet</span></div></div><div class="stat"><div class="stat-icon">▱</div><div><strong>${dueCards().length}</strong><span>Karten neu oder fällig</span></div></div><div class="stat"><div class="stat-icon" style="background:var(--peach)">⌘</div><div><strong>7</strong><span>Interaktive Modelle</span></div></div></section><div class="section-title"><h2>Dein nächster Aha-Moment</h2><button class="btn small" onclick="go('path')">Alle Kapitel →</button></div><div class="grid">${[next,(next+1)%20].map(i=>chapterCard(D[i],i)).join('')}</div><div class="section-title"><h2>So wird Wissen belastbar</h2></div><div class="grid"><div class="card" style="background:#eee8f7"><span class="eyebrow">01 · Verstehen</span><h3>Erst die Idee. Dann die Tiefe.</h3><p>Starte mit den Grundlagen. Öffne danach die Uni-Vertiefung und erkläre den Mechanismus in eigenen Worten.</p><button class="btn small" onclick="go('path')">Zum Lernpfad</button></div><div class="card" style="background:#eaf1df"><span class="eyebrow">02 · Anwenden</span><h3>Vorhersagen statt nur nachlesen.</h3><p>Beantworte Aufgaben vor dem Öffnen der Lösung. Verändere im Labor eine Bedingung und prüfe deine Vorhersage.</p><button class="btn small" onclick="go('exam')">Wissen testen</button></div></div>`,f);}
function renderPath(f=true){const indices=D.map((_,i)=>i).filter(i=>filter==='all'||filter==='saved'&&state.bookmarks.includes(i)||filter==='open'&&!state.done.includes(i)||Number(filter)===group(i));mount(`<div class="page-head"><div class="eyebrow">20 Kapitel · 5 Themenwelten</div><h1>Dein Lernpfad.</h1><p class="lede">Ohne Vorwissen beginnen. Schritt für Schritt bis zu ausgewählten Vertiefungen auf Bachelor-Niveau. Alle Kapitel sind jederzeit zugänglich.</p></div><div class="chips" aria-label="Kapitel filtern">${[['all','Alle'],['open','Noch offen'],['saved','Lesezeichen'],...groups.map((g,i)=>[String(i),g])].map(([k,t])=>`<button class="chip ${filter===k?'active':''}" onclick="filter='${k}';renderPath(false)">${t}</button>`).join('')}</div><div class="grid">${indices.map(i=>chapterCard(D[i],i)).join('')||'<div class="empty full">Hier sind noch keine Kapitel. Wähle einen anderen Filter.</div>'}</div>`,f);}
function qHTML(q,ci,qi){const key=ci+'-'+qi,a=state.answers[key],answered=Number.isInteger(a);return `<div class="question" id="question-${qi}"><div class="eyebrow">Verständnischeck ${qi+1}</div><h3>${esc(q[0])}</h3><div class="options">${q[1].map((t,j)=>`<button class="option ${answered&&(j===q[2]?'correct':j===a?'wrong':'')}" ${answered?'disabled':''} onclick="answerQuestion(${ci},${qi},${j})">${String.fromCharCode(65+j)} · ${esc(t)}</button>`).join('')}</div>${answered?`<div class="feedback ${a===q[2]?'':'bad'}" role="status"><strong>${a===q[2]?'Richtig.':'Noch nicht richtig.'}</strong> ${esc(q[3])}</div>`:''}</div>`;}
function answerQuestion(ci,qi,a){state.answers[ci+'-'+qi]=a;save();$('#question-'+qi).outerHTML=qHTML(D[ci].quiz[qi],ci,qi);}
function resetChapterQuiz(){for(let i=0;i<2;i++)delete state.answers[current+'-'+i];save();$('#checks').innerHTML=D[current].quiz.map((q,j)=>qHTML(q,current,j)).join('');toast('Die beiden Fragen sind wieder offen.');}
function toggleDone(){state.done=state.done.includes(current)?state.done.filter(i=>i!==current):[...state.done,current];save();$('#done-btn').textContent=state.done.includes(current)?'✓ Als bearbeitet markiert':'Kapitel als bearbeitet markieren';}
function renderChapter(f=true){const c=D[current];mount(`<div class="row between no-print"><button class="btn small" onclick="go('path')">← Alle Kapitel</button><button class="btn small" onclick="bookmark(${current})">${state.bookmarks.includes(current)?'★ Gespeichert':'☆ Lesezeichen'}</button></div><div class="page-head"><span class="pill" style="background:${colors[group(current)]}">Kapitel ${String(current+1).padStart(2,'0')} / 20 · ${groups[group(current)]}</span><h1 style="margin-top:18px">${esc(c.title)}</h1><p class="lede">${esc(c.sub)}</p></div><div class="chapter-layout"><article class="reading"><div class="goals"><h3>Nach diesem Kapitel kannst du …</h3><ul>${c.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>${c.sections.map(([h,p],i)=>`<section id="s${i}"><h2>${esc(h)}</h2><p>${esc(p)}</p></section>`).join('')}<details class="deep" id="uni"><summary>＋ Uni-Vertiefung · Mechanismen genauer verstehen</summary><div class="inner">${c.deep.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}</div></details><div class="callout"><strong>Den Denkfehler vermeiden</strong><p>${esc(c.trap)}</p></div>${c.lab?`<div class="card no-print" style="background:#eaf1df;margin:24px 0"><div class="eyebrow">Vom Lesen zum Ausprobieren</div><h3>Mach den Zusammenhang sichtbar.</h3><p>Stelle zuerst eine Vorhersage auf. Verändere dann eine Bedingung im passenden Modell.</p><button class="btn primary" onclick="go('lab','${c.lab}')">Passendes Labor öffnen →</button></div>`:''}<section id="transfer"><h2>Transfer · Jetzt bist du dran</h2><p>${esc(c.task)}</p><details class="answer"><summary>Musterlösung & Begründung</summary><p>${esc(c.solution)}</p></details></section><section id="quiz"><h2>Verstanden? Prüfe dich.</h2><div id="checks">${c.quiz.map((q,j)=>qHTML(q,current,j)).join('')}</div><button class="btn small" onclick="resetChapterQuiz()">Fragen erneut beantworten</button></section><section class="no-print"><h2>Deine Erklärung in eigenen Worten</h2><label class="small muted" for="notes">Was ist der wichtigste Mechanismus? Welche Frage ist noch offen? Notizen werden im Browser gespeichert.</label><textarea id="notes" class="notepad" maxlength="20000" placeholder="Wenn ich es jemandem erklären müsste …">${esc(state.notes[current]||'')}</textarea></section><div class="row no-print"><button id="done-btn" class="btn soft" onclick="toggleDone()">${state.done.includes(current)?'✓ Als bearbeitet markiert':'Kapitel als bearbeitet markieren'}</button><button class="btn" onclick="window.print()">Kapitel drucken</button></div><div class="row between no-print" style="margin-top:24px">${current>0?`<button class="btn" onclick="go('chapter',${current-1})">← Vorheriges</button>`:'<span></span>'}${current<19?`<button class="btn primary" onclick="go('chapter',${current+1})">Nächstes Kapitel →</button>`:`<button class="btn primary" onclick="go('exam')">Zum Prüfungstraining →</button>`}</div></article><aside class="aside-note"><div class="card"><div class="eyebrow">In diesem Kapitel</div>${c.sections.map(([h],i)=>`<a href="#s${i}">${esc(h)}</a>`).join('')}<a href="#uni">Uni-Vertiefung</a><a href="#transfer">Transferaufgabe</a><a href="#quiz">Verständnischeck</a></div><p class="muted" style="margin-top:18px">Lerntipp: Schließe den Text kurz und erkläre den Zusammenhang laut. Wiedererkennen allein ist noch kein Abrufen.</p></aside></div>`,f);$('#notes').addEventListener('input',e=>{state.notes[current]=e.target.value;save();});}
const labs=[['sequence','Sequenz-Werkstatt','DNA → RNA → Protein'],['replication','Replikations-Detektiv','Modelle am Experiment prüfen'],['meiosis','Meiose in Schritten','Chromosomensätze verfolgen'],['cross','Kreuzungs-Labor','Allele & Wahrscheinlichkeiten'],['lac','Genregulations-Schalter','Das lac-Operon erkunden'],['population','Populations-Labor','Hardy-Weinberg & Selektion'],['pcr','PCR-Rechner','Exponentielles Wachstum verstehen']];
function renderLab(){if(!labs.some(x=>x[0]===lab))lab='sequence';mount(`<div class="page-head"><div class="eyebrow">7 Modelle · Unendlich viele Warum-Fragen</div><h1>Das Entdecker-Labor.</h1><p class="lede">Vorhersagen, verändern, vergleichen. Jedes Modell macht Annahmen sichtbar und erklärt seine Grenzen.</p></div><div class="chips">${labs.map(([k,t])=>`<button class="chip ${lab===k?'active':''}" onclick="go('lab','${k}')">${t}</button>`).join('')}</div><div id="lab-content"></div>`);({sequence:seqUI,replication:repUI,meiosis:meiosisUI,cross:crossUI,lac:lacUI,population:popUI,pcr:pcrUI})[lab]();}
const geneticCode={};const bases='UCAG',aa='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';let ai=0;for(const a of bases)for(const b of bases)for(const c of bases)geneticCode[a+b+c]=aa[ai++];
const aaNames={F:'Phenylalanin',L:'Leucin',S:'Serin',Y:'Tyrosin','*':'Stopp',C:'Cystein',W:'Tryptophan',P:'Prolin',H:'Histidin',Q:'Glutamin',R:'Arginin',I:'Isoleucin',M:'Methionin',T:'Threonin',N:'Asparagin',K:'Lysin',V:'Valin',A:'Alanin',D:'Aspartat',E:'Glutamat',G:'Glycin'};
const complement=s=>[...s].map(b=>({A:'T',T:'A',G:'C',C:'G'}[b])).join('');
function trans(s,mode,offset){const coding=mode==='template'?complement(s):s,rna=coding.replace(/T/g,'U'),codons=[];let protein='';for(let i=offset;i+2<rna.length;i+=3){const codon=rna.slice(i,i+3),a=geneticCode[codon];codons.push({codon,a});if(a==='*')break;protein+=a;}return{coding,rna,codons,protein};}
function seqUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><div class="row between"><h2>Sequenz-Werkstatt</h2><span class="pill purple">Standardcode</span></div><p>Ändere eine Base und prüfe, ob sich die Aminosäurefolge verändert. Richtung und Leseraster sind dabei entscheidend.</p><div class="row"><div class="field"><label for="seq-mode">Eingegebener DNA-Strang</label><select id="seq-mode"><option value="coding">Codierender Strang · 5′ → 3′</option><option value="template">Matrizenstrang · 3′ → 5′</option></select></div><div class="field"><label for="seq-frame">Leseraster beginnt bei Base</label><select id="seq-frame"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></div></div><div class="field" style="margin-top:16px"><label for="seq-input">DNA-Sequenz · A, T, G, C · maximal 180 Basen</label><textarea id="seq-input" spellcheck="false" maxlength="220">ATGGCTTGGTAA</textarea></div><div class="row" style="margin-top:14px"><div class="field"><label for="mut-type">Veränderung</label><select id="mut-type"><option value="sub">Substitution</option><option value="ins">Insertion vor Position</option><option value="del">Deletion</option></select></div><div class="field"><label for="mut-pos">Position (ab 1)</label><input id="mut-pos" type="number" min="1" max="180" value="6"></div><div class="field"><label for="mut-base">Neue Base</label><select id="mut-base"><option>A</option><option>T</option><option>G</option><option>C</option></select></div><button class="btn primary" onclick="mutateSeq()">Mutation vergleichen</button></div><div class="row" style="margin-top:18px"><span class="small muted">Beispiele:</span><button class="btn small" onclick="seqExample('syn')">Synonym</button><button class="btn small" onclick="seqExample('miss')">Missense</button><button class="btn small" onclick="seqExample('stop')">Stopp</button><button class="btn small" onclick="seqExample('shift')">Leseraster</button></div><div id="seq-output" aria-live="polite"></div><div id="mutation-output" aria-live="polite"></div><details class="answer"><summary>Alle 64 Codons nachschlagen</summary><div class="table-scroll"><table><thead><tr><th>Codon (5′→3′)</th><th>Aminosäure</th><th>Kürzel</th></tr></thead><tbody>${Object.entries(geneticCode).map(([c,a])=>`<tr><td class="mono">${c}</td><td>${aaNames[a]}</td><td>${a==='*'?'–':a}</td></tr>`).join('')}</tbody></table></div></details><p class="model-note">Modellgrenze: intronfreie Sequenz; Translation ab dem gewählten Leseraster bis zum ersten Stopp. Biologische Startsignale, Spleißen, RNA-Struktur, alternative Codes und Proteinaktivität werden nicht vorhergesagt. Drei-Buchstaben-Basenblöcke sind Codons; einzelne Großbuchstaben der Proteinfolge sind Aminosäurekürzel.</p></section>`;for(const id of ['seq-input','seq-mode','seq-frame'])$('#'+id).addEventListener('input',()=>{$('#mutation-output').innerHTML='';renderSeq();});renderSeq();}
function seqData(){const s=$('#seq-input').value.toUpperCase().replace(/\s/g,'');if(!s||!/^[ATGC]+$/.test(s)||s.length>180)throw Error('Bitte 1–180 DNA-Basen eingeben: nur A, T, G und C. Leerzeichen sind erlaubt.');return{s,mode:$('#seq-mode').value,offset:+$('#seq-frame').value};}
function baseHTML(s){return [...s].map(b=>`<span class="base ${b}">${b}</span>`).join('');}
function renderSeq(){try{const{s,mode,offset}=seqData(),r=trans(s,mode,offset);$('#seq-output').innerHTML=`<div class="lab-output"><div class="eyebrow">Orientierung ist alles</div><div class="small">Codierender DNA-Strang · 5′ → 3′</div><div class="sequence-line">${baseHTML(r.coding)}</div><div class="small">Matrizenstrang · 3′ → 5′</div><div class="sequence-line">${baseHTML(complement(r.coding))}</div><div class="small">mRNA · 5′ → 3′</div><div class="sequence-line">${baseHTML(r.rna)}</div><div class="row between"><strong>Codons → Aminosäuren</strong><button class="btn small" id="codon-step" onclick="stepCodon()">Nächstes Codon →</button></div><div class="sequence-line" id="codon-list">${r.codons.map((c,i)=>`<div class="codon ${i===0?'active':''}"><span class="mono">${c.codon}</span><small>${aaNames[c.a]}</small></div>`).join('')||'<span>Kein vollständiges Codon in diesem Raster.</span>'}</div><p class="small" id="codon-info" aria-live="polite">${r.codons.length?'Schritt 1: '+r.codons[0].codon+' → '+aaNames[r.codons[0].a]:''}</p><strong>Proteinfolge: <span class="mono">${r.protein||'–'}</span></strong><p class="small muted" style="margin:8px 0 0">${r.protein.length} Aminosäuren · ${r.codons.some(c=>c.a==='*')?'Stopp erreicht.':'Kein Stopp im ausgewählten Abschnitt.'} ${(r.rna.length-offset)%3&&!r.codons.some(c=>c.a==='*')?'Unvollständige Restbasen werden nicht übersetzt.':''} ${r.codons[0]&&r.codons[0].codon!=='AUG'?'Dieses Raster beginnt nicht mit AUG; die Anzeige ist eine formale Übersetzung, kein Nachweis einer Translation.':''}</p></div>`;window.seqStep=0;window.seqResult=r;$('#codon-step').disabled=!r.codons.length;}catch(e){$('#seq-output').innerHTML=`<p class="warning" role="alert">${esc(e.message)}</p>`;}}
function stepCodon(){const r=window.seqResult;if(!r||!r.codons.length)return;window.seqStep=(window.seqStep+1)%r.codons.length;$$('#codon-list .codon').forEach((e,i)=>e.classList.toggle('active',i===window.seqStep));const c=r.codons[window.seqStep];$('#codon-info').textContent=`Schritt ${window.seqStep+1}: ${c.codon} → ${aaNames[c.a]}${c.a==='*'?' · Freisetzung, keine neue Aminosäure.':''}`;}
function mutateSeq(){try{const{s,mode,offset}=seqData(),type=$('#mut-type').value,pos=Number($('#mut-pos').value),b=$('#mut-base').value;if(!Number.isInteger(pos)||pos<1||pos>s.length+(type==='ins'?1:0))throw Error('Die Position muss innerhalb der Sequenz liegen; bei Insertion ist auch die Position direkt dahinter erlaubt.');const i=pos-1,m=type==='sub'?s.slice(0,i)+b+s.slice(i+1):type==='ins'?s.slice(0,i)+b+s.slice(i):s.slice(0,i)+s.slice(i+1),before=trans(s,mode,offset),after=trans(m,mode,offset);const result=before.protein===after.protein?'Die übersetzte Aminosäurefolge bleibt in diesem Abschnitt gleich.':after.protein.length<before.protein.length?'Die übersetzte Folge verändert sich und ist hier kürzer.':'Die übersetzte Aminosäurefolge verändert sich.';$('#mutation-output').innerHTML=`<div class="callout"><strong>Vergleich nach ${type==='sub'?'Substitution':type==='ins'?'Insertion':'Deletion'} an Position ${pos}</strong><p class="small">Veränderte Eingabesequenz (${mode==='template'?'3′→5′':'5′→3′'}): <span class="mono">${m||'leer'}</span></p><p>Vorher: <span class="mono">${before.protein||'–'}</span><br>Nachher: <span class="mono">${after.protein||'–'}</span></p><p>${result} ${type!=='sub'?'Eine einzelne eingefügte oder gelöschte Base verschiebt nach der Position die Triplettgrenzen; Auswirkungen hängen auch davon ab, ob der Bereich überhaupt übersetzt wird.':''}</p><p class="model-note">Gleiche Proteinfolge bedeutet nicht zwingend gleiche biologische Wirkung. Veränderungen vor dem gewählten Start können die biologische Initiation beeinflussen; das Modell hält den numerisch gewählten Rasterbeginn fest.</p></div>`;}catch(e){$('#mutation-output').innerHTML=`<p class="warning" role="alert">${esc(e.message)}</p>`;}}
function seqExample(kind){$('#seq-input').value='ATGGCTTGGTAA';$('#seq-mode').value='coding';$('#seq-frame').value='0';$('#mut-type').value=kind==='shift'?'ins':'sub';$('#mut-pos').value=kind==='syn'?6:kind==='miss'?5:kind==='stop'?8:4;$('#mut-base').value='A';renderSeq();mutateSeq();}
function repUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>Replikations-Detektiv</h2><p>Schwere DNA wird in leichtes Nährmedium überführt. Welche Banden würden die drei konkurrierenden Modelle vorhersagen?</p><div class="field"><label for="rep-n">Replikationsrunden: <output id="rep-n-label">1</output></label><input id="rep-n" type="range" min="0" max="5" step="1" value="1"></div><div id="rep-output" aria-live="polite"></div><p class="model-note">Idealmodell: synchron replizierende DNA, vollständiger Wechsel von ¹⁵N zu ¹⁴N, keine Reparatur, kein Abbau und keine Verteilungsbreite. Dichte nimmt im schematischen Röhrchen nach unten zu. Prozentwerte bezeichnen Anteile der DNA-Moleküle, nicht die Stärke real gemessener Banden.</p></section>`;$('#rep-n').addEventListener('input',renderRep);renderRep();}
function repBands(n,model){if(n===0)return[[1,1]];if(model==='semi')return[[.5,2**(1-n)],[0,1-2**(1-n)]].filter(x=>x[1]>0);if(model==='cons')return[[1,2**(-n)],[0,1-2**(-n)]];return[[2**(-n),1]];}
function tube(bands){return `<div class="tube">${bands.map(([density,share])=>`<div class="band" style="top:${16+density*145}px;opacity:${.4+.6*share}"></div><span class="tube-label" style="top:${16+density*145}px">${(share*100).toLocaleString('de-DE',{maximumFractionDigits:2})} %</span>`).join('')}</div>`;}
function renderRep(){const n=+$('#rep-n').value;$('#rep-n-label').textContent=n;$('#rep-output').innerHTML=`<div class="model-grid" style="margin-top:20px">${[['semi','Semikonservativ','Jeder alte Einzelstrang bleibt zusammenhängend erhalten.'],['cons','Konservativ','Der alte Doppelstrang bliebe als Einheit erhalten.'],['disp','Dispersiv','Alte und neue Abschnitte wären in beiden Strängen verteilt.']].map(([key,title,desc])=>`<div class="card"><h3>${title}</h3>${tube(repBands(n,key))}<p class="small">${desc}</p><p class="small muted">Oben: leicht · Mitte: hybrid · unten: schwer</p></div>`).join('')}</div><div class="feedback"><strong>${n===0?'Vor dem Wechsel: alle Modelle identisch.':n===1?'Runde 1: konservativ unterscheidbar.':'Ab Runde 2: semikonservativ und dispersiv unterscheidbar.'}</strong> ${n===0?'Die Markierung betrifft beide Stränge.':n===1?'Eine einzige mittlere Bande widerspricht konservativer Replikation, unterscheidet aber noch nicht semikonservativ von dispersiv.':'Semikonservativ entstehen getrennte hybride und leichte Populationen. Dispersiv wandert eine einzige Bande schrittweise zur leichten Position.'}<br>Semikonservativ: ${2**n} Moleküle pro ursprünglichem Molekül; ${n===0?'100':(100*2**(-n)).toLocaleString('de-DE')} % der gesamten DNA-Strangmasse sind ursprünglich schwer markiert.</div>`;}
function meiosisUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>Meiose in Schritten</h2><p>Verfolge eine Modellzelle mit zwei homologen Chromosomenpaaren (2n = 4). Grün und Violett kennzeichnen die elterliche Herkunft.</p><div class="field"><label for="mei-step">Phase</label><input id="mei-step" type="range" min="0" max="3" value="0" step="1"></div><div id="mei-output" aria-live="polite"></div><div class="row"><button class="btn" onclick="meiMove(-1)">← Zurück</button><button class="btn primary" onclick="meiMove(1)">Weiter →</button></div><p class="model-note">Schema ohne Crossing-over, Spindel und Zufallsverteilung; gezeigt wird eine mögliche Verteilung. Chromosomen sind zur Übersicht auch außerhalb der Teilung kondensiert gezeichnet. Die vier Produkte stehen für ein symmetrisches Modell; menschliche Eizellbildung verläuft asymmetrisch.</p></section>`;$('#mei-step').addEventListener('input',renderMeiosis);renderMeiosis();}

function renderMeiosis(){const i=+$('#mei-step').value,info=[['Vor der Replikation','2n = 4 · 2C','4 Chromosomen, 4 Chromatiden pro Zelle.'],['Nach der S-Phase','2n = 4 · 4C','4 Chromosomen, 8 Chromatiden. Die Ploidie ist unverändert.'],['Nach Meiose I','n = 2 · 2C','2 Chromosomen, 4 Chromatiden pro Zelle. Homologe wurden getrennt.'],['Nach Meiose II','n = 2 · 1C','2 Chromosomen, 2 Chromatiden pro Zelle. Schwesterchromatiden wurden getrennt.']][i],num=i<2?1:i===2?2:4;let svg='<svg viewBox="0 0 640 180" class="lab-svg" role="img" aria-label="Schematische Chromosomenverteilung in der Meiose">';for(let cell=0;cell<num;cell++){const cx=(cell+.5)*640/num,w=num===4?140:170;svg+=`<ellipse cx="${cx}" cy="88" rx="${w/2}" ry="75" fill="#f0f4e8" stroke="#b7c6ab" stroke-width="2"/>`;const chr=i<2?4:2;for(let j=0;j<chr;j++){const x=cx+(j-(chr-1)/2)*27,len=j%2===0?55:37,color=(i<2?j<2:cell%2===0)?'#387557':'#9170b1';svg+=i===1||i===2?`<path d="M ${x-7} ${88-len/2} L ${x+7} ${88+len/2} M ${x+7} ${88-len/2} L ${x-7} ${88+len/2}" stroke="${color}" stroke-width="6" stroke-linecap="round"/>`:`<line x1="${x}" y1="${88-len/2}" x2="${x}" y2="${88+len/2}" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;}}svg+='</svg>';$('#mei-output').innerHTML=`<div class="lab-output"><span class="step-label">SCHRITT ${i+1} / 4</span><h3>${info[0]}</h3>${svg}<div class="row between"><strong>${info[1]}</strong><span>${num} ${num===1?'Zelle':'Zellen'}</span></div><p>${info[2]}</p><p class="small muted">n zählt Chromosomensätze. C bezeichnet die DNA-Menge eines unverdoppelten haploiden Genoms. Angaben gelten pro Zelle.</p></div>`;}
function crossUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>Kreuzungs-Labor</h2><p>Wähle die Genotypen zweier Eltern. Jede Tabellenzelle steht für eine gleich wahrscheinliche Kombination ihrer Gameten.</p><div class="row"><div class="field"><label for="cross-a">Elternteil 1</label><select id="cross-a"><option>AA</option><option selected>Aa</option><option>aa</option></select></div><div class="field"><label for="cross-b">Elternteil 2</label><select id="cross-b"><option>AA</option><option selected>Aa</option><option>aa</option></select></div><div class="field"><label for="cross-dom">Phänotypmodell</label><select id="cross-dom"><option value="complete">Vollständige Dominanz</option><option value="inter">Intermediär</option></select></div></div><div id="cross-output" aria-live="polite"></div><p class="model-note">Ein autosomaler Locus, zwei Allele, gleiche Gametenwahrscheinlichkeiten, vollständige Penetranz und gleiche Überlebenswahrscheinlichkeit. Die Ergebnisse sind Wahrscheinlichkeiten für jeden einzelnen Nachkommen.</p></section>`;['cross-a','cross-b','cross-dom'].forEach(id=>$('#'+id).addEventListener('change',renderCross));renderCross();}
function crossResult(a,b){const counts={AA:0,Aa:0,aa:0};const cells=[...a].map(x=>[...b].map(y=>{const g=[x,y].sort().join('');counts[g]++;return g;}));return{cells,counts};}
function bars(items){return `<div class="bars">${items.map(([name,v,color])=>`<div class="bar-row"><span>${name}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,v))}%;background:${color||'#91b96d'}"></div></div><strong>${v.toLocaleString('de-DE',{maximumFractionDigits:2})} %</strong></div>`).join('')}</div>`;}
function renderCross(){const a=$('#cross-a').value,b=$('#cross-b').value,{cells,counts}=crossResult(a,b),inter=$('#cross-dom').value==='inter';$('#cross-output').innerHTML=`<div class="lab-output"><div class="table-scroll"><table class="punnett"><caption class="small muted">Gameten von Elternteil 1 links, von Elternteil 2 oben</caption><thead><tr><th scope="col">×</th>${[...b].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${cells.map((row,i)=>`<tr><th scope="row">${a[i]}</th>${row.map(g=>`<td class="${g==='Aa'?'hetero':''}">${g}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>Genotypen</h3>${bars(Object.entries(counts).map(([g,n])=>[g,n*25,g==='Aa'?'#b9a0d6':undefined]))}<h3>Phänotypen</h3><p>${inter?`AA-Ausprägung: ${counts.AA*25} % · Zwischenform Aa: ${counts.Aa*25} % · aa-Ausprägung: ${counts.aa*25} %`:`Dominante Ausprägung (AA oder Aa): ${(counts.AA+counts.Aa)*25} % · Rezessive Ausprägung (aa): ${counts.aa*25} %`}</p></div>`;}
function lacUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>Genregulation: das lac-Operon</h2><p>Wird Lactose verwertbar, und fehlt zugleich die bevorzugte Glucose? Prüfe beide Signale unabhängig.</p><div class="row"><div class="field"><label for="lac-l">Lactose / Induktor</label><select id="lac-l"><option value="0">Nicht vorhanden</option><option value="1">Vorhanden</option></select></div><div class="field"><label for="lac-g">Glucose</label><select id="lac-g"><option value="1">Viel</option><option value="0">Wenig</option></select></div></div><div id="lac-output" aria-live="polite"></div><p class="model-note">Qualitatives Lehrmodell für Wildtyp-E. coli: Allolactosebildung, cAMP und CAP werden vereinfacht gekoppelt. Die Balkenhöhe ist keine gemessene Expression. Basale Transkription, Induktor-Exklusion und zeitliche Dynamik werden nicht quantitativ modelliert.</p></section>`;['lac-l','lac-g'].forEach(id=>$('#'+id).addEventListener('change',renderLac));renderLac();}
function renderLac(){const l=+$('#lac-l').value,g=+$('#lac-g').value,level=!l?'Sehr gering':g?'Gering bis mäßig':'Hoch',width=!l?5:g?30:95;$('#lac-output').innerHTML=`<div class="lab-output"><svg viewBox="0 0 650 160" class="lab-svg" role="img" aria-label="Lac-Operon: ${l?'Repressor gelöst':'Repressor gebunden'}, CAP ${g?'inaktiv':'aktiv'}"><line x1="25" y1="103" x2="625" y2="103" stroke="#64815a" stroke-width="7"/><rect x="40" y="85" width="110" height="36" rx="7" fill="#dcebf6"/><text x="95" y="109" text-anchor="middle" font-size="15" fill="#20372f">CAP-Stelle</text><rect x="173" y="85" width="105" height="36" rx="7" fill="#e8dff9"/><text x="225" y="109" text-anchor="middle" font-size="15" fill="#20372f">Promotor</text><rect x="294" y="85" width="94" height="36" rx="7" fill="#ffe2ca"/><text x="341" y="109" text-anchor="middle" font-size="15" fill="#20372f">Operator</text><rect x="412" y="85" width="200" height="36" rx="7" fill="#d7f395"/><text x="512" y="109" text-anchor="middle" font-size="15" fill="#20372f">lacZ · lacY · lacA</text>${!g?'<rect x="62" y="44" width="68" height="34" rx="14" fill="#7292ab"/><text x="96" y="67" text-anchor="middle" fill="white" font-size="14">CAP</text>':''}${!l?'<rect x="300" y="38" width="87" height="41" rx="15" fill="#aa765d"/><text x="343" y="64" text-anchor="middle" fill="white" font-size="13">Repressor</text>':''}</svg><p>Repressor: <strong>${l?'durch Induktor gelöst':'am Operator gebunden'}</strong><br>CAP-Aktivierung: <strong>${g?'gering':'hoch'}</strong></p><h3>Erwartete Expression: ${level}</h3><div class="bar-track" style="height:25px"><div class="bar-fill" style="width:${width}%"></div></div><p class="small" style="margin-top:14px">${!l?'Ohne Induktor hemmt der Repressor die Transkription, auch wenn CAP aktiv ist.':g?'Die Repression ist gelockert, aber starke CAP-vermittelte Aktivierung fehlt.':'Repression ist gelockert und CAP unterstützt die Transkription.'}</p></div>`;}
function popUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>Populations-Labor</h2><p>Verändere eine Allelfrequenz. Beobachte zuerst das Hardy-Weinberg-Modell und anschließend eine Runde Viabilitätsselektion.</p><div class="field"><label for="pop-p">Häufigkeit von A: p = <output id="pop-label"></output></label><input id="pop-p" type="range" min="0" max="100" step="1" value="70"></div><div class="row"><div class="field"><label for="wAA">Relative Fitness AA</label><input id="wAA" type="number" min="0" max="2" step="0.05" value="1"></div><div class="field"><label for="wAa">Relative Fitness Aa</label><input id="wAa" type="number" min="0" max="2" step="0.05" value="1"></div><div class="field"><label for="waa">Relative Fitness aa</label><input id="waa" type="number" min="0" max="2" step="0.05" value="0.5"></div></div><div id="pop-output" aria-live="polite"></div><p class="model-note">Deterministisches Modell: zwei Allele, zufällige Paarung, unendlich große Population, keine Mutation oder Migration. Selektion wird als relative Überlebensgewichtung der Genotypen modelliert. Drift, Geschlechterunterschiede und frequenzabhängige Fitness fehlen. Hardy-Weinberg gilt hier für die Ausgangszygote und bei erneuter Zufallspaarung für die nächste Zygotengeneration.</p></section>`;['pop-p','wAA','wAa','waa'].forEach(id=>$('#'+id).addEventListener('input',renderPop));renderPop();}
function population(p,w){const q=1-p,start=[p*p,2*p*q,q*q],weighted=start.map((x,i)=>x*w[i]),mean=weighted.reduce((a,b)=>a+b,0);if(mean===0)return{start,mean};const after=weighted.map(x=>x/mean),next=after[0]+after[1]/2;return{start,mean,after,next};}
function renderPop(){const p=+$('#pop-p').value/100,w=['wAA','wAa','waa'].map(id=>$('#'+id).value===''?NaN:Number($('#'+id).value));$('#pop-label').textContent=p.toFixed(2);if(w.some(x=>!Number.isFinite(x)||x<0||x>2)){$('#pop-output').innerHTML='<p class="warning">Fitnesswerte müssen zwischen 0 und 2 liegen.</p>';return;}const r=population(p,w);$('#pop-output').innerHTML=`<div class="lab-output"><h3>Ausgangsgenotypen unter Hardy-Weinberg</h3><p class="mono">p + q = 1 · p² + 2pq + q² = 1</p>${bars(r.start.map((v,i)=>[['AA = p²','Aa = 2pq','aa = q²'][i],v*100,colors[i]]))}${r.mean===0?'<p class="warning">Mittlere Fitness = 0: Im Modell überlebt kein Individuum. Eine nächste Allelfrequenz ist nicht definiert.</p>':`<h3>Nach einer Runde Selektion</h3>${bars(r.after.map((v,i)=>[['AA','Aa','aa'][i],v*100,colors[i]]))}<p>Mittlere Fitness: <strong>${r.mean.toFixed(3)}</strong><br>Neue Allelfrequenz: <strong>p′ = ${r.next.toFixed(4)}</strong> (${r.next>p?'A nimmt zu':r.next<p?'A nimmt ab':'A bleibt gleich'}).</p><p class="small">Berechnung: p′ = (p²w<sub>AA</sub> + pqw<sub>Aa</sub>) / w̄. Nach erneuter Zufallspaarung: AA ${(r.next*r.next*100).toFixed(2)} %, Aa ${(2*r.next*(1-r.next)*100).toFixed(2)} %, aa ${((1-r.next)**2*100).toFixed(2)} %.</p>`}</div>`;}
function pcrUI(){$('#lab-content').innerHTML=`<section class="lab-panel"><h2>PCR: kleine Mengen, großer Unterschied</h2><p>Vergleiche ideale Verdopplung mit einer konstant geringeren Effizienz. Die Kurve zeigt die Molekülzahl auf einer logarithmischen Skala.</p><div class="row"><div class="field"><label for="pcr-start">Startmoleküle</label><input id="pcr-start" type="number" min="1" max="1000000" step="1" value="10"></div><div class="field"><label for="pcr-cycles">Zyklen: <output id="cycles-label">20</output></label><input id="pcr-cycles" type="range" min="0" max="40" step="1" value="20"></div><div class="field"><label for="pcr-eff">Effizienz: <output id="eff-label">90 %</output></label><input id="pcr-eff" type="range" min="0" max="100" value="90"></div></div><div id="pcr-output" aria-live="polite"></div><p class="model-note">N = N₀(1 + E)ⁿ. E = 1 bedeutet 100 % Effizienz und Verdopplung; E = 0 keine Zunahme. Das Modell nimmt konstante Effizienz und unbegrenzte Reagenzien an. Eine echte PCR erreicht ein Plateau. Exakt primerbegrenzte Produkte haben zudem eine kurze Anlaufphase; hier werden idealisierte amplifizierbare Moleküle gezählt.</p></section>`;['pcr-start','pcr-cycles','pcr-eff'].forEach(id=>$('#'+id).addEventListener('input',renderPCR));renderPCR();}
function renderPCR(){const n0=Number($('#pcr-start').value),n=+$('#pcr-cycles').value,e=+$('#pcr-eff').value/100;$('#cycles-label').textContent=n;$('#eff-label').textContent=Math.round(e*100)+' %';if(!Number.isInteger(n0)||n0<1||n0>1e6){$('#pcr-output').innerHTML='<p class="warning">Bitte eine ganze Startmenge von 1 bis 1.000.000 eingeben.</p>';return;}const ideal=n0*2**n,actual=n0*(1+e)**n,maxlog=Math.max(1,Math.log10(n0*2**Math.max(n,1))),x=i=>55+i/Math.max(n,1)*520,y=v=>200-Math.log10(v)/maxlog*165;let svg='<svg viewBox="0 0 640 245" class="lab-svg" role="img" aria-label="PCR-Molekülzahlen, logarithmisch, ideal und gewählte Effizienz">';for(let t=0;t<=4;t++){let log=t*maxlog/4,yy=200-t/4*165;svg+=`<line x1="55" x2="575" y1="${yy}" y2="${yy}" stroke="#dce3da"/><text x="48" y="${yy+4}" text-anchor="end" font-size="11" fill="#62746b">10^${log.toFixed(1)}</text>`;}for(const[eff,color]of[[1,'#a28bbc'],[e,'#285d47']]){const pts=Array.from({length:n+1},(_,i)=>`${x(i)},${y(n0*(1+eff)**i)}`);svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3"/><circle cx="${x(n)}" cy="${y(n0*(1+eff)**n)}" r="4" fill="${color}"/>`;}svg+=`<text x="55" y="222" font-size="12" fill="#62746b">0</text><text x="575" y="222" text-anchor="end" font-size="12" fill="#62746b">${Math.max(n,1)} Zyklen</text><text x="55" y="18" font-size="12" fill="#62746b">Moleküle · logarithmisch</text></svg>`;$('#pcr-output').innerHTML=`<div class="lab-output">${svg}<div class="row"><span class="pill purple">Violett: ideale Verdopplung</span><span class="pill">Grün: gewählte Effizienz</span></div><div class="grid" style="margin-top:20px"><div><span class="small muted">Bei ${Math.round(e*100)} % Effizienz</span><div class="big-number">${actual.toExponential(3)}</div></div><div><span class="small muted">Ideal bei 100 %</span><div class="big-number">${ideal.toExponential(3)}</div></div></div><p class="small" style="margin:15px 0 0">Die gewählte Effizienz erreicht ${(actual/ideal*100).toFixed(2)} % der idealen Menge nach ${n} Zyklen. Die Werte sind Modellerwartungen; sie müssen bei nichtidealer Effizienz keine ganzen Zahlen ergeben.</p></div>`;}
function renderCards(f=true){const pool=flashMode==='all'?cards.map((_,i)=>i):dueCards();if(!pool.includes(flashIndex))flashIndex=pool[0]??null;const card=cards[flashIndex];mount(`<div class="page-head"><div class="eyebrow">Aktiver Abruf · Verteiltes Wiederholen</div><h1>Wissen, das bleibt.</h1><p class="lede">Formuliere die Antwort zuerst selbst. Bewerte anschließend ehrlich, wie sicher du sie abrufen konntest.</p></div><div class="row between"><div class="chips"><button class="chip ${flashMode==='due'?'active':''}" onclick="flashMode='due';flashIndex=null;renderCards(false)">Neu & fällig (${dueCards().length})</button><button class="chip ${flashMode==='all'?'active':''}" onclick="flashMode='all';flashIndex=null;renderCards(false)">Alle 60 Karten</button></div><span class="small muted">${Object.keys(state.cards).length} von 60 bereits bewertet</span></div>${card?`<div class="flash"><div class="eyebrow">Kapitel ${card.ci+1} · ${esc(D[card.ci].title)}</div><h2>${esc(card.q)}</h2><p class="muted">Was bedeutet der Begriff? Nenne möglichst ein Beispiel.</p><button id="reveal" class="btn primary" style="align-self:center" onclick="revealCard()">Antwort aufdecken</button><div id="flash-answer" class="flash-answer hidden"><p>${esc(card.a)}</p><div class="row" style="justify-content:center"><button class="btn" onclick="rateCard('again')">Noch unsicher · 10 Min.</button><button class="btn" onclick="rateCard('good')">Gewusst · ${nextInterval('good')} Tage</button><button class="btn soft" onclick="rateCard('easy')">Sicher · ${nextInterval('easy')} Tage</button></div></div></div><div class="row" style="justify-content:center"><button class="btn small" onclick="skipCard()">Andere Karte</button><button class="btn small" onclick="go('chapter',${card.ci})">Im Kapitel nachlesen →</button></div>`:'<div class="empty"><h2>Für jetzt alles wiederholt.</h2><p>Neue Wiederholungen erscheinen, sobald sie fällig sind. Du kannst jederzeit alle Karten frei üben.</p><button class="btn" onclick="flashMode=\'all\';renderCards(false)">Alle Karten üben</button></div>'}<div class="callout"><strong>Dein Wiederholungsplan</strong><p>Unsichere Karten kommen nach 10 Minuten zurück. Gewusste Karten nach mindestens 1 Tag, sichere nach mindestens 3 Tagen; weitere sichere Abrufe verlängern den Abstand bis maximal 90 Tage. Das ist ein einfacher Lernplan, keine Messung deiner tatsächlichen Beherrschung.</p></div>`,f);}
function nextInterval(r){const old=state.cards[flashIndex]?.interval||0;return r==='good'?Math.min(90,Math.max(1,Math.round(old*2))):Math.min(90,Math.max(3,Math.round(old*3)));}
function revealCard(){$('#flash-answer').classList.remove('hidden');$('#reveal').classList.add('hidden');}
function rateCard(r){const interval=r==='again'?0:nextInterval(r),previous=flashIndex;state.cards[flashIndex]={due:Date.now()+(r==='again'?600000:interval*86400000),interval};save();const pool=flashMode==='all'?cards.map((_,i)=>i):dueCards();flashIndex=pool.find(i=>i>previous)??pool[0]??null;renderCards(false);toast(r==='again'?'Wiederholung in 10 Minuten.':`Wiederholung in ${interval} Tagen.`);}
function skipCard(){const pool=flashMode==='all'?cards.map((_,i)=>i):dueCards();if(pool.length>1){flashIndex=pool[(pool.indexOf(flashIndex)+1)%pool.length];renderCards(false);}}
const allQuestions=D.flatMap((c,ci)=>c.quiz.map((q,qi)=>({q,ci,qi})));
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startExam(){const ids=shuffled(D.map((_,i)=>i)).slice(0,10);exam={items:ids.map(ci=>({ci,q:D[ci].quiz[Math.floor(Math.random()*2)]})),answers:{},finished:false};renderExam(false);}
function examAnswer(i,a){if(exam.finished)return;exam.answers[i]=a;renderExamItem(i);$('#exam-progress').textContent=Object.keys(exam.answers).length+' / 10 beantwortet';$('#finish-exam').disabled=Object.keys(exam.answers).length<10;}
function examItem(i){const{q,ci}=exam.items[i],a=exam.answers[i];return `<div class="question" id="exam-q${i}"><div class="eyebrow">Frage ${i+1} · ${esc(D[ci].title)}</div><h3>${esc(q[0])}</h3><div class="options">${q[1].map((t,j)=>`<button class="option ${exam.finished?(j===q[2]?'correct':j===a?'wrong':''):(j===a?'selected':'')}" ${exam.finished?'disabled':''} aria-pressed="${a===j}" onclick="examAnswer(${i},${j})">${String.fromCharCode(65+j)} · ${esc(t)}</button>`).join('')}</div>${exam.finished?`<div class="feedback ${a===q[2]?'':'bad'}"><strong>${a===q[2]?'Richtig.':'Nicht richtig.'}</strong> ${esc(q[3])}<br><button class="btn small" style="margin-top:9px" onclick="go('chapter',${ci})">Kapitel wiederholen →</button></div>`:''}</div>`;}
function renderExamItem(i){$('#exam-q'+i).outerHTML=examItem(i);}
function finishExam(){if(!exam||exam.finished||Object.keys(exam.answers).length<10)return;exam.finished=true;exam.score=exam.items.filter((x,i)=>exam.answers[i]===x.q[2]).length;state.exams.push({date:Date.now(),score:exam.score});state.exams=state.exams.slice(-50);save();renderExam();}
function renderExam(f=true){mount(`<div class="page-head"><div class="eyebrow">Prüfungstraining · Begründen statt raten</div><h1>Wie belastbar ist dein Wissen?</h1><p class="lede">Zehn zufällige Fragen aus zehn verschiedenen Kapiteln. Die Auswertung kommt am Ende. Ergänze den Check durch die offenen Transferaufgaben.</p></div>${!exam?`<div class="card"><h2>Bereit für einen gemischten Check?</h2><p>Keine Zeitbegrenzung. Lösungen und passende Wiederholungskapitel erhältst du nach der Abgabe. Ein Multiple-Choice-Ergebnis ersetzt keine universitäre Prüfung.</p><button class="btn primary" onclick="startExam()">10 Fragen starten →</button></div>`:`${exam.finished?`<div class="card" style="text-align:center;background:#edf3e4"><div class="score-ring">${exam.score}/10</div><h2>${exam.score>=8?'Eine gute Grundlage.':exam.score>=5?'Einige Zusammenhänge sitzen schon.':'Nutze die Fehler als Lernplan.'}</h2><p>Prüfe jede Begründung – auch bei richtigen Antworten. Kannst du sie ohne Auswahlmöglichkeiten erklären?</p><button class="btn primary" onclick="startExam()">Neuen Check starten</button></div>`:`<div class="row between"><span class="pill" id="exam-progress">${Object.keys(exam.answers).length} / 10 beantwortet</span><span class="small muted">Auswahl bis zur Abgabe änderbar</span></div>`}${exam.items.map((_,i)=>examItem(i)).join('')}${!exam.finished?`<button id="finish-exam" class="btn primary" ${Object.keys(exam.answers).length<10?'disabled':''} onclick="finishExam()">Abgeben & auswerten</button>`:''}`}<div class="callout"><strong>Der nächste Schritt: Transfer</strong><p>Die offenen Aufgaben in jedem Kapitel verlangen Herleitung, Interpretation oder Versuchsplanung. Dort zeigt sich besser als im Ankreuztest, ob du einen Mechanismus wirklich anwenden kannst.</p></div>`,f);}
function renderGlossary(){mount(`<div class="page-head"><div class="eyebrow">60 Begriffe · Direkt zum Zusammenhang</div><h1>Dein Nachschlagewerk.</h1><p class="lede">Klare Definitionen und der direkte Weg zurück ins passende Kapitel.</p></div><div class="field"><label for="glossary-search">Begriff oder Definition filtern</label><input id="glossary-search" type="search" placeholder="Zum Beispiel: Allel, Epigenetik, DNA …"></div><dl class="glossary" id="glossary-list"></dl>`);$('#glossary-search').addEventListener('input',filterGlossary);filterGlossary();}
function filterGlossary(){const q=$('#glossary-search').value.toLocaleLowerCase('de');const list=cards.filter(c=>(c.q+' '+c.a).toLocaleLowerCase('de').includes(q)).sort((a,b)=>a.q.localeCompare(b.q,'de'));$('#glossary-list').innerHTML=list.map(c=>`<div class="card"><dt>${esc(c.q)}</dt><dd>${esc(c.a)}<br><button class="btn small" style="margin-top:12px" onclick="go('chapter',${c.ci})">Kapitel ${c.ci+1} →</button></dd></div>`).join('')||'<div class="empty full">Kein Begriff gefunden.</div>';}
function renderSearch(query,f=true){const q=String(query||'').trim(),lower=q.toLocaleLowerCase('de'),hits=lower?D.map((c,i)=>({c,i})).filter(({c})=>JSON.stringify(c).toLocaleLowerCase('de').includes(lower)):[];mount(`<div class="page-head"><div class="eyebrow">Volltextsuche</div><h1>${q?'Ergebnisse für „'+esc(q)+'“':'Was möchtest du verstehen?'}</h1><p class="lede">${hits.length} passende Kapitel. Durchsucht werden Grundlagen, Vertiefungen, Aufgaben und Begriffe.</p></div><div class="grid">${hits.map(({c,i})=>chapterCard(c,i)).join('')||'<div class="empty full">Probiere einen anderen Begriff, zum Beispiel „Spleißen“, „Replikation“ oder „Heritabilität“.</div>'}</div>`,f);}
function exportState(){const data=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download='genetik-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Lernstand als Datei exportiert.');}
function renderSettings(f=true){const answered=Object.keys(state.answers).length,correct=Object.entries(state.answers).filter(([k,v])=>{const[c,q]=k.split('-').map(Number);return D[c]?.quiz[q]?.[2]===v;}).length;mount(`<div class="page-head"><div class="eyebrow">Dein Lernen · Deine Daten</div><h1>Mein Lernstand.</h1><p class="lede">Fortschritt und Notizen bleiben in diesem Browser. Mit einem Export kannst du sie sichern oder auf ein anderes Gerät übertragen.</p></div><div class="stats"><div class="stat"><div><strong>${state.done.length}/20</strong><span>Als bearbeitet markiert</span></div></div><div class="stat"><div><strong>${correct}/${answered}</strong><span>Aktuell richtige Kapitelantworten</span></div></div><div class="stat"><div><strong>${state.exams.length}</strong><span>Abgeschlossene Checks</span></div></div></div><div class="grid"><div class="card"><h2>Sichern & übertragen</h2><p>Offline-Datei und GitHub-Seite haben getrennte Browser-Speicher. Auch ein anderer Browser synchronisiert sich nicht automatisch.</p><div class="row"><button class="btn primary" onclick="exportState()">Lernstand exportieren</button><label for="import-file" class="btn" style="cursor:pointer">Lernstand importieren</label><input id="import-file" type="file" accept=".json,application/json" class="hidden"></div><div id="import-preview" aria-live="polite"></div><p class="small muted" style="margin-top:16px">Export enthält deine Notizen. Browserdaten-Löschen oder privates Surfen kann gespeicherte Daten entfernen. ${storageOK?'Speicherung ist verfügbar.':'Dauerhafte Speicherung ist hier nicht verfügbar.'}</p></div><div class="card"><h2>Dein Wiederholungsplan</h2><p><strong>${dueCards().length}</strong> Karten sind neu oder fällig. Bewertungen basieren auf deiner Selbsteinschätzung.</p><button class="btn" onclick="go('cards')">Jetzt wiederholen →</button><h3 style="margin-top:24px">Prüfungsverlauf</h3>${state.exams.length?`<ul>${state.exams.slice(-5).reverse().map(x=>`<li>${new Date(x.date).toLocaleDateString('de-DE')} · ${x.score}/10 richtig</li>`).join('')}</ul>`:'<p class="muted">Noch kein gemischter Check abgeschlossen.</p>'}</div><div class="card full"><h2>Deine Notizen</h2>${Object.entries(state.notes).filter(([k,v])=>v.trim()).map(([k,v])=>`<details class="answer"><summary>${Number(k)+1}. ${esc(D[k].title)}</summary><p style="white-space:pre-wrap">${esc(v)}</p><button class="btn small" onclick="go('chapter',${k})">Weiterbearbeiten →</button></details>`).join('')||'<p class="muted">In jedem Kapitel findest du ein Feld für eigene Erklärungen und offene Fragen.</p>'}</div><div class="card full"><h3>Lernstand zurücksetzen</h3><p class="small muted">Löscht nur die lokal gespeicherten Notizen, Bewertungen und Fortschritte dieser Lernplattform. Sichere sie vorher bei Bedarf.</p><button class="btn danger" onclick="$('#reset-confirm').classList.remove('hidden')">Zurücksetzen …</button><div id="reset-confirm" class="warning hidden">Wirklich alle lokalen Lerndaten dieser Plattform löschen?<div class="row" style="margin-top:10px"><button class="btn danger" onclick="state=fresh();exam=null;flashIndex=null;save();renderSettings(false);toast('Lernstand zurückgesetzt.')">Ja, Lerndaten löschen</button><button class="btn" onclick="$('#reset-confirm').classList.add('hidden')">Abbrechen</button></div></div></div></div>`,f);$('#import-file').addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('Datei ist zu groß. Maximal 2 MB.');window.pendingImport=validState(JSON.parse(await file.text()));$('#import-preview').innerHTML=`<div class="feedback">Erkannte Sicherung: ${window.pendingImport.done.length} bearbeitete Kapitel, ${Object.keys(window.pendingImport.notes).length} Notizfelder. Der Import ersetzt deinen aktuellen Lernstand.<div class="row" style="margin-top:10px"><button class="btn primary" onclick="applyImport()">Sicherung übernehmen</button><button class="btn" onclick="window.pendingImport=null;$('#import-preview').innerHTML=''">Abbrechen</button></div></div>`;}catch(err){$('#import-preview').innerHTML=`<p class="warning">Import nicht möglich: ${esc(err.message)}</p>`;}});}

function renderSources(){mount(`<div class="page-head"><div class="eyebrow">Einordnen · Nachlesen · Weiterlernen</div><h1>Wissenschaft braucht Grenzen.</h1><p class="lede">Ein strukturierter Einstieg mit ausgewählten Bachelor-Vertiefungen. Diese Plattform ist kein vollständiges universitäres Genetikstudium und keine medizinische Beratung.</p></div><div class="card"><h2>Quellen & weiterführende Literatur</h2><p>Die Erklärungen sind eigenständig formulierte Lerntexte. Die folgenden frei zugänglichen Fachressourcen bieten vertiefende Lektüre und fachliche Orientierung. Externe Links benötigen Internet; der gesamte Kurs und alle Modelle funktionieren ohne sie.</p><ul class="source-list"><li><a href="https://www.ncbi.nlm.nih.gov/books/NBK26821/" target="_blank" rel="noopener">Alberts et al.: The Structure and Function of DNA</a><br><span class="small muted">Molecular Biology of the Cell, 4. Auflage (2002), NCBI Bookshelf. Struktur und Information; ältere Genanzahlschätzungen nicht als aktuellen Stand übernehmen.</span></li><li><a href="https://www.ncbi.nlm.nih.gov/books/NBK26887/" target="_blank" rel="noopener">Alberts et al.: From DNA to RNA</a><br><span class="small muted">Transkription, RNA-Verarbeitung und grundlegende Mechanismen.</span></li><li><a href="https://www.ncbi.nlm.nih.gov/books/NBK26818/" target="_blank" rel="noopener">Alberts et al.: Studying Gene Expression and Function</a><br><span class="small muted">Experimentelle Logik und Analyse von Genfunktionen; historische Methoden im Kontext lesen.</span></li><li><a href="https://www.genome.gov/genetics-glossary" target="_blank" rel="noopener">NHGRI: Talking Glossary of Genomic and Genetic Terms</a><br><span class="small muted">Begriffe aus Genetik und Genomik.</span></li><li><a href="https://www.genome.gov/genetics-glossary/Epigenetics" target="_blank" rel="noopener">NHGRI: Epigenetics</a><br><span class="small muted">Einordnung epigenetischer Veränderungen.</span></li><li><a href="https://medlineplus.gov/genetics/understanding/genomicresearch/genomeediting/" target="_blank" rel="noopener">MedlinePlus Genetics: Genome editing and CRISPR-Cas9</a><br><span class="small muted">Prinzipien und Anwendungsgrenzen der Genomeditierung.</span></li><li><a href="https://medlineplus.gov/genetics/understanding/" target="_blank" rel="noopener">MedlinePlus Genetics: Help Me Understand Genetics</a><br><span class="small muted">Vererbung, Varianten und medizinische Zusammenhänge.</span></li><li><a href="https://learn.genetics.utah.edu/content/basics/txtl/" target="_blank" rel="noopener">University of Utah: Transcribe and Translate a Gene</a><br><span class="small muted">Ergänzende Lernaktivität zur Proteinbiosynthese.</span></li></ul><p class="small muted">Fachliche Orientierung und Linkprüfung: September 2026. Forschung entwickelt sich weiter. Bei Streitfragen Primärstudien und aktuelle Fachliteratur heranziehen; ein Lehrmodell ist keine empirische Vorhersage für jeden Einzelfall.</p></div><div class="card" style="margin-top:20px"><h2>Was die Modelle leisten</h2><div class="table-scroll"><table><thead><tr><th>Modell</th><th>Berechnet / zeigt</th><th>Wichtige Grenze</th></tr></thead><tbody><tr><td>Sequenzen</td><td>Komplement, RNA, Codons, Mutationsvergleich</td><td>Gewähltes Raster; keine biologische Start- oder Funktionsvorhersage</td></tr><tr><td>Replikation</td><td>Erwartete Dichtebanden dreier Modelle</td><td>Synchrones Idealexperiment ohne Abbau</td></tr><tr><td>Meiose</td><td>Ploidie und DNA-Menge je Teilung</td><td>Kein Crossing-over oder Zufall dargestellt</td></tr><tr><td>Kreuzung</td><td>Genotyp- und Phänotypwahrscheinlichkeiten</td><td>Ein Locus; keine variable Penetranz</td></tr><tr><td>lac-Operon</td><td>Qualitative Regulationszustände</td><td>Keine kalibrierte Expressionsmenge</td></tr><tr><td>Population</td><td>Hardy-Weinberg und eine Selektionsrunde</td><td>Keine Drift, Migration oder Mutation</td></tr><tr><td>PCR</td><td>Ideales Wachstum bei konstanter Effizienz</td><td>Kein Plateau oder Reagenzienverbrauch</td></tr></tbody></table></div></div><div class="grid" style="margin-top:20px"><div class="card"><h2>Dein Projekt</h2><p><strong>Genetik verstehen – ein Lernprojekt von Leonard Fritsch</strong></p><p class="small">Konzept nach Vorgaben von Leonard Fritsch. Text, Programmierung und schematische Grafiken mit KI-Unterstützung erstellt. Eigenständiges Design; keine Canva-Vorlage wurde übernommen, da die Abfrage keine zugängliche Marken-Vorlage ergab.</p><p class="small">Keine extern geladenen Schriften, Bilder, Skripte oder Analysedienste. Deine Lernstände werden lokal im Browser gespeichert. Die Datei selbst enthält beim Herunterladen keinen persönlichen Lernstand.</p></div><div class="card"><h2>Auf GitHub Pages veröffentlichen</h2><ol><li>Diese Datei als <strong>index.html</strong> in das Hauptverzeichnis eines GitHub-Repositories hochladen.</li><li>Unter <strong>Settings → Pages</strong> die Veröffentlichung aus einem Branch auswählen.</li><li>Den Branch mit der Datei, meist <strong>main</strong>, und <strong>/(root)</strong> auswählen und speichern.</li><li>Die von GitHub bereitgestellte Pages-Adresse öffnen.</li></ol><p class="small">Es ist kein Build-Schritt nötig. Die Verfügbarkeit von Pages für private Repositories hängt vom GitHub-Tarif ab. Für Offline-Nutzung die heruntergeladene Datei in einem Browser öffnen; manche mobile Dateivorschauen führen JavaScript nicht aus.</p><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site" target="_blank" rel="noopener">GitHub-Anleitung zur Veröffentlichung →</a></div></div>`);}
